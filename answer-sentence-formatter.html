<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問題×解答 完全文生成ツール</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --panel: #ffffff;
      --ink: #2b2a28;
      --sub: #6b6a66;
      --accent: #a8613f;
      --accent-dark: #8a4d31;
      --line: #e3e0da;
      --warn: #b5482a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0 0 20px;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.6;
    }

    .warn-mark {
      color: var(--warn);
    }

    /* ---- パネル（入力 2 枚＋出力 1 枚で共通） ---- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }

    .panel label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid .panel {
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fdfcfa;
      color: var(--ink);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
    }

    #output {
      min-height: 340px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* ---- ボタン ---- */
    .btnrow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.05s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .ghost:hover {
      background: #eeece7;
    }

    /* ---- ステータス・注記 ---- */
    .status {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--sub);
    }

    .status.warn {
      color: var(--warn);
    }

    .note {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--sub);
    }
  </style>
</head>
<body>

  <h1>問題 × 解答 → 完全文＋和訳 生成ツール</h1>
  <p class="lead">
    左に問題文、右に解答（解説・訳を含む）をそのまま貼り付けて「生成」を押すと、
    空所補充・語順整序・和文英訳などの問題を「完成英文；和訳」の形にまとめます。<br>
    プリント形式（①②③…の大問）と、教材形式（STEP／FRAME／EXERCISE A〜D、選択肢①〜④が問題文中にあるもの）を自動判定します。
    自動解析が難しい行は <span class="warn-mark">⚠️</span> マークが付くので、下の出力欄で直接修正できます。
  </p>

  <div class="grid">
    <div class="panel">
      <label for="problemInput">問題（貼り付け）</label>
      <textarea id="problemInput" placeholder="ここに問題文を貼り付け"></textarea>
    </div>
    <div class="panel">
      <label for="answerInput">解答（解説・訳を含めてそのまま貼り付け）</label>
      <textarea id="answerInput" placeholder="ここに解答文を貼り付け"></textarea>
    </div>
  </div>

  <div class="btnrow">
    <button class="primary" onclick="generate()">生成する</button>
    <button class="ghost" onclick="loadSample()">サンプル（プリント形式）</button>
    <button class="ghost" onclick="loadSampleTextbook()">サンプル（STEP/FRAME形式）</button>
    <button class="ghost" onclick="clearAll()">クリア</button>
    <button class="ghost" onclick="copyOutput()">出力をコピー</button>
    <button class="ghost" onclick="downloadOutput()">.txt でダウンロード</button>
  </div>

  <div class="panel">
    <label for="output">出力（自由に編集できます）</label>
    <textarea id="output" placeholder="ここに結果が表示されます"></textarea>
    <div class="status" id="status"></div>
    <p class="note">
      形式: 「①」などの見出し行の下に「番号)　完成した英文; 和訳」が並びます。
      自動判定できなかった箇所は ⚠️ を目印に手直ししてください。
    </p>
  </div>

    /* ---------------------------------------------------------------------
     * 2. 画面操作
     * ------------------------------------------------------------------- */

    function $(id) {
      return document.getElementById(id);
    }

    function setStatus(message, isWarn) {
      const el = $('status');
      el.textContent = message || '';
      el.className = 'status' + (isWarn ? ' warn' : '');
    }

      $('answerInput').value = SAMPLE_WORKSHEET_ANSWER;

    function loadSampleTextbook() {

      $('output').value = '';

    }

    }

      const url = URL.createObjectURL(blob);

    /* ---------------------------------------------------------------------
     * 3. 共通の文字列ユーティリティ
     * ------------------------------------------------------------------- */

    function containsJapanese(str) {
      return JP_CHAR_RE.test(str || '');
    }

    // 「(a, b, c)」のようなカンマ区切りの語群を含むか
    function hasCommaWordBank(str) {
      return /[（(][^）)]*[，,][^）)]*[）)]/.test(str || '');
    }

    function firstLineTrim(str) {
      return str ? str.split('\n')[0].trim() : '';
    }

    function numSort(a, b) {
      return parseInt(a, 10) - parseInt(b, 10);
    }

    // 「1) …　2) …」形式（半角数字＋半角閉じ括弧）を { '1': '…', '2': '…' } に分解する
    function extractNumberedItems(str) {
      // マーカー直後の全角スペースは最大1つだけ消費する。
      // 貪欲な \s* だと、直後に来る「空所を表すタブや全角スペースの連続」まで食べてしまう。
      const re = /(\d+)\)　?/g;
      const matches = [];
      let m;
      while ((m = re.exec(str)) !== null) {
        matches.push({ num: m[1], idx: m.index, end: re.lastIndex });
      }

      const items = {};
      matches.forEach((cur, i) => {
        const end = (i + 1 < matches.length) ? matches[i + 1].idx : str.length;
        // 末尾の空白だけ削る（先頭の空白は空所の目印かもしれないので残す）
        items[cur.num] = str.slice(cur.end, end).replace(/\s+$/, '');
      });
      return items;
    }


    /* ---------------------------------------------------------------------
     * 4. プリント形式（①②③…の大問）
     * ------------------------------------------------------------------- */

    /* ---- 4-1. 解析 ---- */

    // 全文を ①②③…／[Give It a Try!] ごとの大問に分割する
    function splitMajorSections(text) {
      const markers = [];
      for (let i = 0; i < CIRCLED_DIGITS.length; i++) {
        markers.push({ key: String(i + 1), re: new RegExp(CIRCLED_DIGITS[i]) });
      }
      markers.push({ key: 'give', re: /\[?\s*Give It a Try/ });

      const positions = [];
      markers.forEach(marker => {
        const idx = text.search(marker.re);
        if (idx !== -1) positions.push({ key: marker.key, idx: idx });
      });
      positions.sort((a, b) => a.idx - b.idx);

      const sections = {};
      positions.forEach((pos, i) => {
        const end = (i + 1 < positions.length) ? positions[i + 1].idx : text.length;
        sections[pos.key] = text.slice(pos.idx, end);
      });
      return sections;
    }

    // 「訳」ブロックの番号付き項目を返す（なければ {}）
    function extractYakuBlock(text) {
      const yakuIdx = text.search(/訳/);
      if (yakuIdx === -1) return {};
      return extractNumberedItems(text.slice(yakuIdx + 1));
    }

    // 解答側 → 問題側の順で「訳」ブロックを探す
    function getTranslationItems(problemSection, answerSection) {
      const fromAnswer = extractYakuBlock(answerSection);
      if (Object.keys(fromAnswer).length) return fromAnswer;
      return extractYakuBlock(problemSection);
    }

    // 「a. …　b. …」形式の選択肢ボックスを { a: '…', b: '…' } にする（2つ未満なら {}）
    function extractLetterOptions(sectionText) {
      const map = {};
      const re = /(?:^|[\t\n])([a-h])\.\s*([^\t\n]+)/g;
      let m;
      while ((m = re.exec(sectionText)) !== null) {
        let value = m[2];
        value = value.split(/[\s　]{3,}/)[0];          // 大きな空きのあとの脚注を落とす
        value = value.replace(/\*+\s*$/, '').trim();
        if (value) map[m[1]] = value;
      }
      return Object.keys(map).length >= 2 ? map : {};
    }

    // 問題の1項目から、日本語の文（最初の「。」まで）を取り出す
    function extractJapaneseUpToPeriod(str) {
      const m = str.match(/^[\s　]*([^。]*。)/);
      return m ? m[1].trim() : null;
    }

    /* ---- 4-2. 文の組み立て ---- */

    // 「ヒントだけの行」（例：［wait］）か
    function isHintOnlyLine(line) {
      return line.replace(/[［\[][^］\]]*[］\]]/g, '').trim().length === 0;
    }

    // 「語群だけの行」（例：(can, on, you, someone, depend)）か
    function isWordBankOnlyLine(line) {
      return /^[（(][^（）()]*[，,][^（）()]*[）)]\.?$/.test(line.trim());
    }

    // 空所を含む英文を1つにまとめる。
    // 前の行は、文末記号で終わっていない（＝折り返しの続き）ときだけ連結する。
    function buildSentenceCandidate(itemText) {
      const lines = (itemText || '').split('\n').filter(l => l.trim().length > 0);
      const candidates = lines.filter(line =>
        !isHintOnlyLine(line) && !isWordBankOnlyLine(line) && !containsJapanese(line)
      );
      if (candidates.length === 0) {
        return lines.length ? lines[lines.length - 1] : (itemText || '');
      }

      const result = [candidates[candidates.length - 1]];
      for (let i = candidates.length - 2; i >= 0; i--) {
        if (/[.!?]\s*$/.test(candidates[i].trim())) break;   // 別の完結した文 → 連結しない
        result.unshift(candidates[i]);
      }
      return result.join(' ');
    }

    // 文中のさまざまな空所表記を BLANK_TOKEN に統一する
    function normalizeLineBlanks(line) {
      // (　　　) のように全角/半角スペース2つ以上を含む括弧は、どこにあっても空所
      let text = line.replace(/[（(][\s　]{2,}[）)]/g, ' ' + BLANK_TOKEN + ' ');

      // タブを左から順に見る。タブの後ろが日本語や語群なら、そこから先は参考情報なので切り落とす。
      // 通常の英語が続くタブは本物の空所なので、次の手順に残す。
      let cutAt = -1;
      let searchFrom = 0;
      while (true) {
        const tabIdx = text.indexOf('\t', searchFrom);
        if (tabIdx === -1) break;
        const nextTabIdx = text.indexOf('\t', tabIdx + 1);
        const segment = nextTabIdx === -1 ? text.slice(tabIdx + 1) : text.slice(tabIdx + 1, nextTabIdx);
        const looksLikeReference = containsJapanese(segment) || /^\s*[（(][^（）()]*[，,]/.test(segment);
        if (looksLikeReference) {
          cutAt = tabIdx;
          break;
        }
        searchFrom = tabIdx + 1;
      }
      if (cutAt !== -1) text = text.slice(0, cutAt);

      // 残ったタブ／全角スペース2つ以上の最初の1か所を空所にする（2か所目以降はただの余白）
      let converted = false;
      text = text.replace(/\t|[ ]?　{2,}[ ]?/g, () => {
        if (converted) return ' ';
        converted = true;
        return ' ' + BLANK_TOKEN + ' ';
      });
      return text;
    }

    // 整序・和文英訳の解答行から完成英文を作る：[別解] を消し、（）は記号だけ外す
    function buildFullSentence(raw) {
      return raw
        .replace(/[\[［][^\]］]*[\]］]/g, '')       // 別解の角括弧を中身ごと削除
        .replace(/[（(]/g, '').replace(/[）)]/g, '')  // 括弧記号のみ削除
        .replace(/\*/g, '')                           // 脚注の * を削除
        .replace(/\s{2,}/g, ' ')
        .trim()
        .replace(/\s+([.,?!])/g, '$1');
    }

    // テンプレート文の BLANK_TOKEN を answers の順に埋める。足りなければ ⚠️?? を入れる
    function fillBlanks(template, answers) {
      let i = 0;
      let result = template.replace(BLANK_RE, () => {
        const value = (answers[i] !== undefined) ? answers[i] : '⚠️??';
        i++;
        return value;
      });
      result = result
        .replace(/[［\[][^］\]]*[］\]]/g, '')       // 残ったヒント括弧を除去
        .replace(/\s{2,}/g, ' ')
        .trim()
        .replace(/\s+([.,?!])/g, '$1');
      // 解答の末尾の「.」とテンプレートの「.」が重なったときの重複を畳む（「?」は ⚠️?? と紛らわしいので除外）
      return result.replace(/([.!])\1+/g, '$1');
    }

    /* ---- 4-3. 1項目ごとの生成（種類別） ---- */

    // 種類D：a〜h の選択肢ボックスから選ぶ形式（解答は記号1文字）
    function buildBoxChoiceItem(problemText, letterKey, letterOptions, yakuItem) {
      const template = normalizeLineBlanks(firstLineTrim(problemText));
      return {
        sentence: fillBlanks(template, [letterOptions[letterKey]]),
        translation: yakuItem || extractJapaneseUpToPeriod(problemText),
        warnings: 0
      };
    }

    // 種類A：空所補充。解答が「不足分だけ」でも「文全体」でも対応する
    function buildFillBlankItem(sentenceCandidate, rawAnswer, yakuItem, problemText) {
      let template = sentenceCandidate;

      // 語群や脚注（「天才」など）をテンプレートから切り落とす
      const wordBank = template.match(/[（(][^（）()]*[，,][^（）()]*[）)]/);
      if (wordBank) template = template.slice(0, wordBank.index);
      const footIdx = template.search(FOOTNOTE_MARK_RE);
      if (footIdx !== -1) template = template.slice(0, footIdx);
      template = template.replace(/\s{2,}/g, ' ').trim();

      const blankCount = (template.match(BLANK_RE) || []).length;
      const parts = template.split(BLANK_TOKEN);
      const prefix = (parts[0] || '').trim();
      const suffix = (parts[parts.length - 1] || '').trim().replace(/[.,!?]+$/, '');
      const cleanedAnswer = buildFullSentence(rawAnswer);
      const comparable = cleanedAnswer.toLowerCase().replace(/[.,!?]+$/, '');

      // 解答が空所の前後の固定部分を含んでいれば「文全体」とみなす
      const looksLikeFullSentence =
        (prefix.length >= 3 && comparable.startsWith(prefix.toLowerCase())) ||
        (suffix.length >= 3 && comparable.endsWith(suffix.toLowerCase()));

      const translation = yakuItem || extractJapaneseUpToPeriod(problemText);
      if (looksLikeFullSentence && rawAnswer) {
        return { sentence: cleanedAnswer, translation: translation, warnings: 0 };
      }

      // 空所が1つなら解答全体を1語句として使う（「, when」や「X. / Y.」を壊さないため分割しない）
      let answers;
      if (blankCount === 1) {
        answers = cleanedAnswer ? [cleanedAnswer] : [];
      } else {
        answers = cleanedAnswer.split(/[,，・\/／]/).map(s => s.trim()).filter(Boolean);
        if (answers.length !== blankCount) {
          const byWhitespace = cleanedAnswer.split(/\s+/).filter(Boolean);
          if (byWhitespace.length === blankCount) answers = byWhitespace;
        }
      }

      if (answers.length === 0) {
        return { sentence: '⚠️ ' + template, translation: translation, warnings: 1 };
      }
      const sentence = fillBlanks(template, answers);
      return {
        sentence: sentence,
        translation: translation,
        warnings: sentence.indexOf('⚠️') !== -1 ? 1 : 0
      };
    }

    // 種類B：整序・和文英訳。解答に完成文が書かれている
    function buildWordOrderItem(problemText, rawAnswer, yakuItem) {
      const translation = yakuItem || extractJapaneseUpToPeriod(problemText);
      if (!rawAnswer) {
        return { sentence: '⚠️ 解答が見つかりません', translation: translation, warnings: 1 };
      }
      return { sentence: buildFullSentence(rawAnswer), translation: translation, warnings: 0 };
    }

    // 種類C：問題に完全な英文があり、解答が和訳
    function buildTranslationOnlyItem(problemText, rawAnswer, yakuItem) {
      const sentence = firstLineTrim(problemText);
      return {
        sentence: sentence || '⚠️ 英文が見つかりません',
        translation: yakuItem || (rawAnswer ? rawAnswer.trim() : ''),
        warnings: sentence ? 0 : 1
      };
    }

    // 1項目を種類判定して生成する
    function buildWorksheetItem(num, ctx) {
      const problemText = ctx.problemItems[num] || '';
      const rawAnswer = (ctx.answerItems[num] || '').trim();
      const yakuText = (ctx.yakuItems[num] && ctx.yakuItems[num].trim()) || '';
      const letterKey = rawAnswer.toLowerCase();

      // 空所を含む文を、折り返しの続きも含めて組み立てる
      const sentenceCandidate = normalizeLineBlanks(buildSentenceCandidate(problemText));

      let result;
      if (Object.keys(ctx.letterOptions).length && /^[a-h]$/.test(letterKey) && ctx.letterOptions[letterKey]) {
        result = buildBoxChoiceItem(problemText, letterKey, ctx.letterOptions, yakuText);
      } else if (sentenceCandidate.includes(BLANK_TOKEN)) {
        result = buildFillBlankItem(sentenceCandidate, rawAnswer, yakuText, problemText);
      } else if (containsJapanese(problemText) || hasCommaWordBank(problemText)) {
        result = buildWordOrderItem(problemText, ctx.answerItems[num], yakuText);
      } else {
        result = buildTranslationOnlyItem(problemText, ctx.answerItems[num], yakuText);
      }

      let warnings = result.warnings;
      let translation = result.translation;
      if (!translation) {
        translation = '⚠️ 和文が見つかりません';
        warnings++;
      }
      const sentence = result.sentence
        ? result.sentence.replace(/\*/g, '').replace(/\s{2,}/g, ' ').trim()
        : result.sentence;

      return { line: `${num})　${sentence}; ${translation}`, warnings: warnings };
    }

    /* ---- 4-4. セクション単位の生成 ---- */

    // ①②③…の大問
    function buildNumberedSection(problemSection, answerSection) {
      const kaisetsuIdx = answerSection.search(/解説/);
      const answerListPart = kaisetsuIdx !== -1 ? answerSection.slice(0, kaisetsuIdx) : answerSection;

      const ctx = {
        answerItems: extractNumberedItems(answerListPart),
        yakuItems: getTranslationItems(problemSection, answerSection),
        problemItems: extractNumberedItems(problemSection),
        letterOptions: extractLetterOptions(problemSection)
      };

      let nums = Object.keys(ctx.problemItems).sort(numSort);
      if (nums.length === 0) nums = Object.keys(ctx.answerItems).sort(numSort);

      const lines = [];
      let warnings = 0;
      nums.forEach(num => {
        const item = buildWorksheetItem(num, ctx);
        lines.push(item.line);
        warnings += item.warnings;
      });
      return { lines: lines, warnings: warnings };
    }

    // [Give It a Try!]（例）と 1) 2) …）
    function buildGiveItATrySection(problemSection, answerSection) {
      // 「例)」は「0)」として同じ番号付き項目の処理に乗せる
      const problemText = problemSection.replace(/例\)/, '0)');
      const answerText = answerSection.replace(/例\)/, '0)');

      const yakuIdx = answerText.search(/訳/);
      const answerListPart = yakuIdx !== -1 ? answerText.slice(0, yakuIdx) : answerText;
      const answerItems = extractNumberedItems(answerListPart);
      const translationItems = getTranslationItems(problemText, answerText);

      const lines = [];
      let warnings = 0;
      Object.keys(answerItems).sort(numSort).forEach(num => {
        const sentence = buildFullSentence(answerItems[num]);
        const translation = translationItems[num]
          ? translationItems[num].trim()
          : '⚠️ 訳が見つかりません';
        if (!translationItems[num]) warnings++;
        const label = (num === '0') ? '例)' : num + ')';
        lines.push(`${label}　${sentence}; ${translation}`);
      });
      return { lines: lines, warnings: warnings };
    }

    /* ---- 4-5. 全体 ---- */

    function generateWorksheet(problemText, answerText) {
      const outputLines = [];
      let warnings = 0;

      // タイトル：問題の1行目を、空白2つ以上の手前で切ったもの
      const firstLine = problemText.split('\n')[0] || '';
      outputLines.push(firstLine.split(/\s{2,}/)[0].trim() || firstLine.trim());

      const problemSections = splitMajorSections(problemText);
      const answerSections = splitMajorSections(answerText);

      // 実際に見つかった大問を番号順に並べ、最後に Give It a Try
      const numericKeys = Object.keys(problemSections).filter(k => k !== 'give').sort(numSort);
      const sectionKeys = numericKeys.concat(problemSections.give ? ['give'] : []);

      sectionKeys.forEach(key => {
        if (!problemSections[key] || !answerSections[key]) return;

        const label = (key === 'give')
          ? '[Give It a Try!]'
          : (CIRCLED_DIGITS[parseInt(key, 10) - 1] || `(${key})`);
        outputLines.push('', label);

        try {
          const builder = (key === 'give') ? buildGiveItATrySection : buildNumberedSection;
          const section = builder(problemSections[key], answerSections[key]);
          outputLines.push(...section.lines);
          warnings += section.warnings;
        } catch (e) {
          outputLines.push(`⚠️ このセクションは自動解析に失敗しました（${e.message}）。手動で編集してください。`);
          warnings++;
        }
      });

      return { text: outputLines.join('\n'), warnings: warnings, summary: '' };
    }


    /* ---------------------------------------------------------------------
     * 5. 教材形式（STEP／FRAME／EXERCISE A〜D）
     *    「□ 01」形式の項目、選択肢①〜④が問題文中にある教材向け
     * ------------------------------------------------------------------- */

    const TB_CIRCLED = '[\\u2460-\\u2473]';   // ①〜⑳
    const TB_CIRCLED_RE = new RegExp(TB_CIRCLED);
    const TB_CIRCLED_GLOBAL_RE = new RegExp(TB_CIRCLED, 'g');

    function isTextbookFormat(problemText) {
      return /EXERCISE[\s　]*[A-Z][\s　]*>>/.test(problemText)
        || /(^|\n)[ \t　]*FRAME[\s　]*\d+/.test(problemText);
    }

    /* ---- 5-1. 解析 ---- */

    // 全文を「STEP → セクション（FRAME / A / B…）→ 項目」に分解する
    function parseTextbook(text, isAnswer) {
      const stepRe = /^[\s　]*■?[\s　]*STEP[\s　]*(\d+)/i;
      const sectionRe = /^[\s　]*EXERCISE[\s　]+([A-Z])\b/i;
      const frameRe = /^[\s　]*FRAME[\s　]*(\d+)[\s　]*(.*)$/;
      const boxRe = /^[\s　]*□[\s　]*(\d+)[\s　]*(.*)$/;      // 問題側の項目
      const answerNumRe = /^(\d{1,3})[\s　]+(.*)$/;           // 解答側の項目（行頭が数字）

      const steps = [];
      let step = null;
      let section = null;
      let item = null;

      function ensureStep() {
        if (!step) {
          step = { no: '0', title: '', sections: [] };
          steps.push(step);
        }
      }

      function openSection(key) {
        ensureStep();
        section = step.sections.find(s => s.key === key);
        if (!section) {
          section = { key: key, items: [] };
          step.sections.push(section);
        }
        item = null;
      }

      function addItem(num, label, head) {
        item = { num: String(parseInt(num, 10)), label: label, head: head, lines: [] };
        section.items.push(item);
      }

      text.replace(/\r/g, '').split('\n').forEach(line => {
        let m;

        if ((m = line.match(stepRe))) {
          step = {
            no: String(parseInt(m[1], 10)),
            title: line.replace(/^[\s　]*■/, '').trim(),
            sections: []
          };
          steps.push(step);
          openSection('FRAME');
        } else if ((m = line.match(sectionRe))) {
          openSection(m[1].toUpperCase());
        } else if ((m = line.match(frameRe))) {
          if (!section || section.key !== 'FRAME') openSection('FRAME');
          addItem(m[1], 'FRAME ' + m[1], m[2]);
        } else if (!isAnswer && (m = line.match(boxRe))) {
          if (!section) openSection('?');
          addItem(m[1], m[1], m[2]);
        } else if (isAnswer && section && section.key !== 'FRAME' && (m = line.match(answerNumRe))) {
          addItem(m[1], m[1], m[2]);
        } else if (item) {
          item.lines.push(line);
        }
      });

      return steps;
    }

    // 〈大学名〉を除き、空白類を1つにまとめる
    function tbClean(str) {
      return (str || '').replace(/〈[^〉]*〉/g, '').replace(/[\s　]+/g, ' ').trim();
    }

    // 和文用：OCR由来の不要な空白を除く（「 次の → 「次の など）
    function tbCleanJapanese(str) {
      return (str || '')
        .replace(/[\s　]+/g, ' ')
        .replace(/「 +/g, '「')
        .replace(/ +」/g, '」')
        .replace(/([^\x00-\x7F]) +(?=[^\x00-\x7F])/g, '$1')
        .trim();
    }

    // 解答側の1項目を分類する
    //   error  ：「④ talked ➡ talked about」（誤文訂正）
    //   choice ：「② 和訳…」（選択肢の番号が先頭）
    //   text   ：「英文…」（整序・語句補充）
    function parseTextbookAnswer(answer) {
      const head = (answer.head || '').trim();
      const firstNonEmptyLine = (answer.lines.find(l => l.trim() !== '') || '').trim();

      let m = head.match(new RegExp('^(' + TB_CIRCLED + ')[\\s　]*(.*?)[\\s　]*[➡→⇒][\\s　]*(.+)$'));
      if (m) {
        return {
          type: 'error',
          mark: m[1],
          before: m[2].trim(),
          after: m[3].trim(),
          translation: tbCleanJapanese(firstNonEmptyLine)
        };
      }

      m = head.match(new RegExp('^(' + TB_CIRCLED + ')[\\s　]*(.*)$'));
      if (m) {
        // 訳は1行目の残り＋インデントされていない続きの行（会話文など）
        const parts = [m[2].trim()];
        for (const line of answer.lines) {
          if (line.trim() === '' || /^[\s　]/.test(line)) break;
          parts.push(line.trim());
        }
        return { type: 'choice', mark: m[1], translation: tbCleanJapanese(parts.join(' ')) };
      }

      return { type: 'text', english: head, translation: tbCleanJapanese(firstNonEmptyLine) };
    }

    // 問題側にある和文指示（整序問題など）を取り出す。なければ ''
    function extractProblemJapanese(problemText) {
      const text = problemText.replace(/〈[^〉]*〉/g, '').replace(/［[^］]*］/g, '');
      const re = /[\u3040-\u30FF\u4E00-\u9FFF。、，．「」]/g;
      let last = -1;
      let m;
      while ((m = re.exec(text)) !== null) last = m.index;
      return last === -1 ? '' : tbCleanJapanese(text.slice(0, last + 1));
    }

    /* ---- 5-2. 種類別の生成 ---- */

    // 選択式：問題文の空所に、解答の番号に対応する選択肢を入れる
    function buildTextbookChoice(problemText, parsed) {
      const optionsStart = problemText.search(TB_CIRCLED_RE);
      const stem = tbClean(optionsStart === -1 ? problemText : problemText.slice(0, optionsStart));
      const optionsText = optionsStart === -1 ? '' : problemText.slice(optionsStart);

      const options = {};
      const optionRe = new RegExp('(' + TB_CIRCLED + ')([^\\u2460-\\u2473]*)', 'g');
      let m;
      while ((m = optionRe.exec(optionsText)) !== null) options[m[1]] = tbClean(m[2]);

      const chosen = options[parsed.mark];
      const blankRe = /[（(]\s*[）)]/;
      if (!chosen) return { sentence: '⚠️ ' + stem, warnings: 1 };
      // 空所がなければ（下線部の言い換え問題など）英文をそのまま使う
      return { sentence: blankRe.test(stem) ? stem.replace(blankRe, ' ' + chosen + ' ') : stem, warnings: 0 };
    }

    // 誤文訂正：番号の位置にある誤り部分を「➡」の右側に差し替える
    function buildTextbookCorrection(problemText, parsed) {
      let sentence = problemText.replace(/〈[^〉]*〉/g, '').replace(/[\t\n]+/g, ' ');
      const markPos = sentence.indexOf(parsed.mark);
      let applied = false;

      if (markPos !== -1 && parsed.before) {
        const prefix = sentence.slice(0, markPos);
        const rest = sentence.slice(markPos + 1);
        const restTrimmed = rest.replace(/^[\s　]+/, '');
        const before = parsed.before.toLowerCase();

        if (restTrimmed.toLowerCase().startsWith(before)) {
          sentence = prefix + parsed.after + restTrimmed.slice(parsed.before.length);
          applied = true;
        } else {
          const k = rest.toLowerCase().indexOf(before);
          if (k !== -1) {
            sentence = prefix + rest.slice(0, k) + parsed.after + rest.slice(k + parsed.before.length);
            applied = true;
          }
        }
      }

      sentence = sentence.replace(TB_CIRCLED_GLOBAL_RE, '');
      return applied
        ? { sentence: sentence, warnings: 0 }
        : { sentence: '⚠️ ' + sentence, warnings: 1 };
    }

    // 整序・語句補充：解答の英文が完成文。和訳は問題文の日本語を優先
    function buildTextbookCompleteSentence(problemText, parsed) {
      let warnings = 0;
      const sentence = parsed.english.replace(/[（(][^）)]*不要[）)]/g, '');
      if (!sentence.trim()) warnings++;

      let translation = parsed.translation;
      const problemJapanese = extractProblemJapanese(problemText);
      if (problemJapanese) {
        translation = problemJapanese;
      } else if (/(という意味を表|を表すので|と考える|に注意|で「[^」]*」という意味)/.test(translation)) {
        // 訳ではなく解説の行を拾った可能性
        translation = '⚠️ ' + translation;
        warnings++;
      }
      return {
        sentence: sentence.trim() ? sentence : '⚠️ 英文が見つかりません',
        translation: translation,
        warnings: warnings
      };
    }

    function buildTextbookItem(item, answer) {
      if (!answer) return { sentence: '⚠️ 解答が見つかりません', translation: '', warnings: 1 };

      const problemText = [item.head].concat(item.lines).join('\n');
      const parsed = parseTextbookAnswer(answer);

      let result;
      if (parsed.type === 'choice') {
        result = buildTextbookChoice(problemText, parsed);
      } else if (parsed.type === 'error') {
        result = buildTextbookCorrection(problemText, parsed);
      } else {
        result = buildTextbookCompleteSentence(problemText, parsed);
      }

      let warnings = result.warnings;
      let translation = result.translation !== undefined ? result.translation : parsed.translation;
      if (!translation) {
        translation = '⚠️ 和訳が見つかりません';
        warnings++;
      }
      const sentence = result.sentence
        .replace(/\*/g, '')
        .replace(/\s+([.,?!;:])/g, '$1')
        .replace(/\s{2,}/g, ' ')
        .trim();

      return { sentence: sentence, translation: translation, warnings: warnings };
    }

    /* ---- 5-3. 全体 ---- */

    function generateTextbook(problemText, answerText) {
      const problemSteps = parseTextbook(problemText, false);
      const answerSteps = parseTextbook(answerText, true);

      // 「STEP番号|セクション|項目番号」で解答を引けるようにする
      const answerMap = {};
      answerSteps.forEach(step => step.sections.forEach(section => section.items.forEach(item => {
        answerMap[`${step.no}|${section.key}|${item.num}`] = item;
      })));

      const outputLines = [];
      let warnings = 0;
      let count = 0;

      problemSteps.forEach(step => {
        if (!step.sections.some(section => section.items.length)) return;

        if (outputLines.length) outputLines.push('');
        outputLines.push(step.title || ('STEP ' + step.no));

        step.sections.forEach(section => {
          if (!section.items.length) return;

          outputLines.push('', section.key === 'FRAME' ? 'FRAME' : 'EXERCISE ' + section.key);
          section.items.forEach(item => {
            const built = buildTextbookItem(item, answerMap[`${step.no}|${section.key}|${item.num}`]);
            outputLines.push(`${item.label})　${built.sentence}; ${built.translation}`);
            warnings += built.warnings;
            count++;
          });
        });
      });

      return { text: outputLines.join('\n'), warnings: warnings, count: count };
    }


    /* ---------------------------------------------------------------------
     * 6. 生成ボタン：入力形式を判定して振り分ける
     * ------------------------------------------------------------------- */

    function generate() {
      const problemText = $('problemInput').value;
      const answerText = $('answerInput').value;

      if (!problemText.trim() || !answerText.trim()) {
        setStatus('問題と解答の両方を貼り付けてください。', true);
        return;
      }

      // 教材形式（STEP / FRAME / EXERCISE）
      if (isTextbookFormat(problemText)) {
        const result = generateTextbook(problemText, answerText);
        $('output').value = result.text;

        if (result.count === 0) {
          setStatus('問題が1件も見つかりませんでした。問題文の貼り付け内容を確認してください。', true);
        } else if (result.warnings > 0) {
          setStatus(`教科書形式で ${result.count} 問を生成しました。⚠️ が ${result.warnings} 箇所あります。出力欄で確認・修正してください。`, true);
        } else {
          setStatus(`教科書形式で ${result.count} 問を生成しました。内容を確認してください。`, false);
        }
        return;
      }

      // プリント形式（①②③…の大問）
      const result = generateWorksheet(problemText, answerText);
      $('output').value = result.text;

      if (result.warnings > 0) {
        setStatus(`生成しました。⚠️ が ${result.warnings} 箇所あります。出力欄で確認・修正してください。`, true);
      } else {
        setStatus('生成しました。内容を確認してください。', false);
      }
    }
  </script>
