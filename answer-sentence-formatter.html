<h1>問題 × 解答 → 完全文＋和訳 生成ツール</h1>
<p class="lead">
  左に問題文、右に解答（解説・訳を含む）をそのまま貼り付けて「生成」を押すと、
  空所補充・語順整序・和文英訳などの問題を「完成英文；和訳」の形にまとめます。
  プリント形式（①②③…の大問）と、教材形式（STEP／FRAME／EXERCISE A〜D、選択肢①〜④が問題文中にあるもの）を自動判定します。
  自動解析が難しい行は <span style="color:var(--warn)">⚠️</span> マークが付くので、下の出力欄で直接修正できます。
</p>

<div class="grid">
  <div class="panel">
    <label for="problemInput">問題（貼り付け）</label>
    <textarea id="problemInput" placeholder="ここに問題文を貼り付け"></textarea>
  </div>
  <div class="panel">
    <label for="answerInput">解答（解説・訳を含めてそのまま貼り付け）</label>
    <textarea id="answerInput" placeholder="ここに解答文を貼り付け"></textarea>
  </div>
</div>

<div class="btnrow">
  <button class="primary" onclick="generate()">生成する</button>
  <button class="ghost" onclick="loadSample()">サンプル（プリント形式）</button>
  <button class="ghost" onclick="loadSampleTB()">サンプル（STEP/FRAME形式）</button>
  <button class="ghost" onclick="clearAll()">クリア</button>
  <button class="ghost" onclick="copyOutput()">出力をコピー</button>
  <button class="ghost" onclick="downloadOutput()">.txt でダウンロード</button>
</div>

<div class="output-panel">
  <label for="output">出力（自由に編集できます）</label>
  <textarea id="output" placeholder="ここに結果が表示されます"></textarea>
  <div class="status" id="status"></div>
  <p class="note">形式: 「①」などの見出し行の下に「番号)　完成した英文; 和訳」が並びます。自動判定できなかった箇所は ⚠️ を目印に手直ししてください。</p>
</div>

function loadSampleTB(){
  document.getElementById('problemInput').value = SAMPLE_TB_PROBLEM;
  document.getElementById('answerInput').value = SAMPLE_TB_ANSWER;
  setStatus('教科書形式のサンプルを読み込みました。「生成する」を押してください。', false);
}

function loadSample(){
  document.getElementById('problemInput').value = SAMPLE_PROBLEM;
  document.getElementById('answerInput').value = SAMPLE_ANSWER;
  setStatus('サンプルを読み込みました。「生成する」を押してください。', false);
}

function clearAll(){
  document.getElementById('problemInput').value = '';
  document.getElementById('answerInput').value = '';
  document.getElementById('output').value = '';
  setStatus('');
}

function setStatus(msg, isWarn){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isWarn ? ' warn' : '');
}

function copyOutput(){
  const out = document.getElementById('output');
  out.select();
  document.execCommand('copy');
  setStatus('出力をコピーしました。', false);
}

function downloadOutput(){
  const text = document.getElementById('output').value;
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'answer_output.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function extractNumberedItems(str){
  const items = {};
  // Consume at most a single ideographic separator space after "N)" — never a greedy \s*, which
  // would swallow a blank (a tab, or a run of ideographic spaces) sitting right after the marker.
  const re = /(\d+)\)　?/g;
  const matches = [];
  let m;
  while((m = re.exec(str)) !== null){
    matches.push({num:m[1], idx:m.index, end:re.lastIndex});
  }
  for(let i=0;i<matches.length;i++){
    const start = matches[i].end;
    const end = (i+1<matches.length) ? matches[i+1].idx : str.length;
    // trim only trailing whitespace/newlines — leading whitespace may itself be a blank marker
    items[matches[i].num] = str.slice(start,end).replace(/\s+$/, '');
  }
  return items;
}

// find first index of a marker (regex) in text, -1 if not found
function findIdx(text, re){
  const m = text.search(re);
  return m;
}

// Circled digits ①-⑳, in order, for building/matching section markers dynamically
const CIRCLED_DIGITS = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

// Split full text into major sections keyed by circled numbers (①②③④⑤...) and Give It a Try —
// a lesson may have anywhere from a couple to half a dozen numbered exercise sections.
function splitMajorSections(text){
  const markers = [];
  for(let i=0;i<CIRCLED_DIGITS.length;i++){
    markers.push({key:String(i+1), re:new RegExp(CIRCLED_DIGITS[i])});
  }
  markers.push({key:'give', re:/\[?\s*Give It a Try/});
  const positions = [];
  markers.forEach(mk=>{
    const idx = findIdx(text, mk.re);
    if(idx !== -1) positions.push({key:mk.key, idx});
  });
  positions.sort((a,b)=>a.idx-b.idx);
  const sections = {};
  for(let i=0;i<positions.length;i++){
    const start = positions[i].idx;
    const end = (i+1<positions.length) ? positions[i+1].idx : text.length;
    sections[positions[i].key] = text.slice(start,end);
  }
  return sections;
}

// Unique token that stands in for a detected blank once problem text is normalized
const BLANK_TOKEN = '@@BLANK@@';
const JP_CHAR_RE = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/;
// Broader marker used only for trimming trailing footnote glosses out of an isolated template
// line — also catches CJK brackets like 「」 that JP_CHAR_RE (kana/kanji only) would miss.
const FOOTNOTE_MARK_RE = /[「」\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/;

// Does this line, on its own, contribute nothing to the sentence — just a hint bracket like
// "［wait］" with nothing else?
function isHintOnlyLine(line){
  return line.replace(/[［\[][^］\]]*[］\]]/g, '').trim().length === 0;
}
// Does this line consist ONLY of a word-bank parenthetical, e.g. "(can, on, you, someone, depend)"?
function isWordBankOnlyLine(line){
  return /^[（(][^（）()]*[，,][^（）()]*[）)]\.?$/.test(line.trim());
}

// Build the English sentence-in-progress for an item by keeping the line that has to contain the
// blank/answer and merging in any earlier line ONLY if that earlier line is a wrapped
// continuation of the same sentence (doesn't already end with . ! ?) rather than a separate,
// already-complete sentence used purely as context.
function buildSentenceCandidate(itemText){
  const lines = (itemText || '').split('\n').filter(l=>l.trim().length>0);
  const candidates = lines.filter(line =>
    !isHintOnlyLine(line) && !isWordBankOnlyLine(line) && !containsJapanese(line)
  );
  if(candidates.length === 0) return lines.length ? lines[lines.length-1] : (itemText || '');
  const result = [candidates[candidates.length-1]];
  for(let i=candidates.length-2; i>=0; i--){
    const prev = candidates[i];
    if(/[.!?]\s*$/.test(prev.trim())) break; // a separate complete sentence — stop merging
    result.unshift(prev);
  }
  return result.join(' ');
}

// Detect every blank-marker style seen in these worksheets within a single (already-merged)
// sentence line and normalize them all into one consistent token.
function normalizeLineBlanks(line){
  // explicit paren-blank markers are safe to detect anywhere, and there can be more than one
  let t = line.replace(/[（(][\s　]{2,}[）)]/g, ' ' + BLANK_TOKEN + ' ');

  // Walk the tabs left to right. A tab followed by Japanese text or a comma word-bank is the
  // start of trailing reference material (word bank / footnote gloss) — cut the line there. A
  // tab followed by ordinary English content is a real blank, so leave it for the next step.
  let cutAt = -1;
  let searchFrom = 0;
  while(true){
    const tabIdx = t.indexOf('\t', searchFrom);
    if(tabIdx === -1) break;
    const nextTabIdx = t.indexOf('\t', tabIdx + 1);
    const segment = nextTabIdx === -1 ? t.slice(tabIdx + 1) : t.slice(tabIdx + 1, nextTabIdx);
    const looksLikeReference = containsJapanese(segment) || /^\s*[（(][^（）()]*[，,]/.test(segment);
    if(looksLikeReference){
      cutAt = tabIdx;
      break;
    }
    searchFrom = tabIdx + 1;
  }
  if(cutAt !== -1) t = t.slice(0, cutAt);

  // Now convert the first remaining bare blank (a tab, or a run of 2+ ideographic spaces) into
  // the token; any further one is just leftover formatting, not a second blank.
  let converted = false;
  t = t.replace(/\t|[ ]?　{2,}[ ]?/g, (m) => {
    if(!converted){ converted = true; return ' ' + BLANK_TOKEN + ' '; }
    return ' ';
  });

  return t;
}

// For type-B (word order / translation) answer lines: strip [alt] choices and () markers, keep content
function buildFullSentence(raw){
  let s = raw;
  // remove alternate-choice brackets entirely, e.g. [got], [You shouldn't / should not]
  s = s.replace(/[\[［][^\]］]*[\]］]/g, '');
  // remove parenthesis characters only, keep inner words
  s = s.replace(/[（(]/g, '').replace(/[）)]/g, '');
  // drop stray footnote-reference asterisks (e.g. "lied*")
  s = s.replace(/\*/g, '');
  // collapse whitespace
  s = s.replace(/\s{2,}/g, ' ').trim();
  // drop trailing stray punctuation duplication spaces before punctuation
  s = s.replace(/\s+([.,?!])/g, '$1');
  return s;
}

// Fill BLANK_TOKEN placeholders in a template sentence with an ordered list of words
function fillBlanks(template, answers){
  let i = 0;
  const re = new RegExp(BLANK_TOKEN.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
  let result = template.replace(re, () => {
    const val = (answers[i] !== undefined) ? answers[i] : '⚠️??';
    i++;
    return val;
  });
  // strip leftover hint brackets just in case
  result = result.replace(/[［\[][^］\]]*[］\]]/g, '');
  result = result.replace(/\s{2,}/g, ' ').trim();
  result = result.replace(/\s+([.,?!])/g, '$1');
  // an inserted answer that already ends in "." or "!" can collide with the template's own
  // trailing punctuation (e.g. "...exam. ." -> "...exam.."); collapse the duplicate. Leave "?"
  // alone since "??" is also used as the missing-answer warning marker.
  result = result.replace(/([.!])\1+/g, '$1');
  return result;
}

// Extract Japanese sentence portion (up to and including first 。) from a problem item line
function extractJapaneseUpToPeriod(str){
  const m = str.match(/^[\s　]*([^。]*。)/);
  if(m) return m[1].trim();
  return null;
}

function numSort(a,b){ return parseInt(a,10) - parseInt(b,10); }

// Find a "訳" block within a chunk of text and return its numbered items ({} if none found)
function extractYakuBlock(text){
  const yakuIdx = text.search(/訳/);
  if(yakuIdx === -1) return {};
  const after = text.slice(yakuIdx + 1);
  return extractNumberedItems(after);
}

// Try answer section first, then problem section, for a 訳 block. Returns {} if neither has one.
function getTranslationItems(probSectionText, ansSectionText){
  let items = extractYakuBlock(ansSectionText);
  if(Object.keys(items).length) return items;
  items = extractYakuBlock(probSectionText);
  if(Object.keys(items).length) return items;
  return {};
}

function containsJapanese(str){
  return JP_CHAR_RE.test(str || '');
}
function hasCommaWordBank(str){
  return /[（(][^）)]*[，,][^）)]*[）)]/.test(str || '');
}
function firstLineTrim(str){
  if(!str) return '';
  return str.split('\n')[0].trim();
}
// Remove any line that contains Japanese characters, keeping only the English portion (used before filling blanks)
function stripJapaneseLines(str){
  if(!str) return '';
  return str.split('\n')
    .filter(line => !containsJapanese(line))
    .map(line => line.replace(/^[\t ]+|[\t ]+$/g, ''))
    .join(' ')
    .trim();
}
// Extract a lettered option box ("a. ..." "b. ..." etc) from a section of problem text, if present.
// Returns {a: 'phrase', b: 'phrase', ...} or {} if no such pattern is found.
function extractLetterOptions(sectionText){
  const map = {};
  const re = /(?:^|[\t\n])([a-h])\.\s*([^\t\n]+)/g;
  let m;
  while((m = re.exec(sectionText)) !== null){
    let val = m[2];
    // drop a trailing footnote separated from the phrase by a big gap
    val = val.split(/[\s　]{3,}/)[0];
    val = val.replace(/\*+\s*$/, '').trim();
    if(val) map[m[1]] = val;
  }
  // only trust this as a real option box if we found at least two lettered entries
  return (Object.keys(map).length >= 2) ? map : {};
}

// ============================================================================
// 教科書形式（STEP / FRAME / EXERCISE A〜D, 「□ 01」形式, 選択肢①〜④が問題文内）用の解析
// ============================================================================
const TB_CIRC = '[\\u2460-\\u2473]';           // ①〜⑳
const TB_CIRC_RE = new RegExp(TB_CIRC);
const TB_CIRC_G = new RegExp(TB_CIRC, 'g');

function isTextbookFormat(p){
  return /EXERCISE[\s　]*[A-Z][\s　]*>>/.test(p) || /(^|\n)[ \t　]*FRAME[\s　]*\d+/.test(p);
}

// 問題文・解答文を「STEP → セクション(FRAME / A / B…) → 項目」に分解する
function tbParse(text, isAnswer){
  const lines = text.replace(/\r/g, '').split('\n');
  const steps = [];
  let step = null, sec = null, item = null;
  const stepRe  = /^[\s　]*■?[\s　]*STEP[\s　]*(\d+)/i;
  const secRe   = /^[\s　]*EXERCISE[\s　]+([A-Z])\b/i;
  const frameRe = /^[\s　]*FRAME[\s　]*(\d+)[\s　]*(.*)$/;
  const boxRe   = /^[\s　]*□[\s　]*(\d+)[\s　]*(.*)$/;
  const ansNumRe= /^(\d{1,3})[\s　]+(.*)$/;      // 解答側は行頭が数字（インデントなし）

  function ensureStep(){
    if(!step){ step = {no:'0', title:'', sections:[]}; steps.push(step); }
  }
  function openSec(key){
    ensureStep();
    sec = step.sections.find(s => s.key === key);
    if(!sec){ sec = {key:key, items:[]}; step.sections.push(sec); }
    item = null;
  }
  for(const raw of lines){
    let m;
    if((m = raw.match(stepRe))){
      step = {no:String(parseInt(m[1],10)), title:raw.replace(/^[\s　]*■/, '').trim(), sections:[]};
      steps.push(step);
      openSec('FRAME');
      continue;
    }
    if((m = raw.match(secRe))){ openSec(m[1].toUpperCase()); continue; }
    if((m = raw.match(frameRe))){
      if(!sec || sec.key !== 'FRAME') openSec('FRAME');
      item = {num:String(parseInt(m[1],10)), label:'FRAME ' + m[1], head:m[2], lines:[]};
      sec.items.push(item);
      continue;
    }
    if(!isAnswer && (m = raw.match(boxRe))){
      if(!sec) openSec('?');
      item = {num:String(parseInt(m[1],10)), label:m[1], head:m[2], lines:[]};
      sec.items.push(item);
      continue;
    }
    if(isAnswer && sec && sec.key !== 'FRAME' && (m = raw.match(ansNumRe))){
      item = {num:String(parseInt(m[1],10)), label:m[1], head:m[2], lines:[]};
      sec.items.push(item);
      continue;
    }
    if(item) item.lines.push(raw);
  }
  return steps;
}

// 〈大学名〉を除き、空白類を1つにまとめる
function tbClean(s){
  return (s || '').replace(/〈[^〉]*〉/g, '').replace(/[\s　]+/g, ' ').trim();
}
// 和文：OCR由来の不要な空白を除く（「 次の → 「次の など）
function tbCleanJP(s){
  return (s || '')
    .replace(/[\s　]+/g, ' ')
    .replace(/「 +/g, '「').replace(/ +」/g, '」')
    .replace(/([^\x00-\x7F]) +(?=[^\x00-\x7F])/g, '$1')
    .trim();
}

// 解答側の1項目を分類する： error（➡あり）/ choice（①〜が先頭）/ text（英文が先頭）
function tbParseAnswerItem(a){
  const head = (a.head || '').trim();
  let m;
  // 先頭の空行は読み飛ばし、最初の非空行を取る
  const extra = a.lines.slice();
  const firstNonEmpty = () => {
    for(const l of extra){ if(l.trim() !== '') return l.trim(); }
    return '';
  };
  m = head.match(new RegExp('^(' + TB_CIRC + ')[\\s　]*(.*?)[\\s　]*[➡→⇒][\\s　]*(.+)$'));
  if(m){
    return {type:'error', mark:m[1], before:m[2].trim(), after:m[3].trim(), translation:tbCleanJP(firstNonEmpty())};
  }
  m = head.match(new RegExp('^(' + TB_CIRC + ')[\\s　]*(.*)$'));
  if(m){
    // 訳は1行目の残り＋インデントされていない続きの行（会話文など）
    const parts = [m[2].trim()];
    for(const l of extra){
      if(l.trim() === '' || /^[\s　]/.test(l)) break;
      parts.push(l.trim());
    }
    return {type:'choice', mark:m[1], translation:tbCleanJP(parts.join(' '))};
  }
  return {type:'text', english:head, translation:tbCleanJP(firstNonEmpty())};
}

// 問題側に和文（並べかえ・整序問題の日本語指示）があれば取り出す
function tbProblemJapanese(probFull){
  let t = probFull.replace(/〈[^〉]*〉/g, '').replace(/［[^］]*］/g, '');
  const re = /[\u3040-\u30FF\u4E00-\u9FFF。、，．「」]/g;
  let last = -1, m;
  while((m = re.exec(t)) !== null) last = m.index;
  if(last === -1) return '';
  return tbCleanJP(t.slice(0, last + 1));
}

function tbBuild(it, a){
  const probFull = [it.head].concat(it.lines).join('\n');
  if(!a) return {sentence:'⚠️ 解答が見つかりません', translation:'', warn:1};
  const pa = tbParseAnswerItem(a);
  let sentence = '', translation = pa.translation || '', warn = 0;

  if(pa.type === 'choice'){
    // 問題文を「文」と「選択肢」に分ける
    const ci = probFull.search(TB_CIRC_RE);
    const stem = tbClean(ci === -1 ? probFull : probFull.slice(0, ci));
    const optsText = ci === -1 ? '' : probFull.slice(ci);
    const opts = {};
    const re = new RegExp('(' + TB_CIRC + ')([^\\u2460-\\u2473]*)', 'g');
    let m;
    while((m = re.exec(optsText)) !== null) opts[m[1]] = tbClean(m[2]);
    const chosen = opts[pa.mark];
    const blankRe = /[（(]\s*[）)]/;
    if(!chosen){
      sentence = '⚠️ ' + stem; warn++;
    } else if(blankRe.test(stem)){
      sentence = stem.replace(blankRe, ' ' + chosen + ' ');
    } else {
      sentence = stem;   // 下線部の言い換え問題など：空所なし → 英文をそのまま
    }

  } else if(pa.type === 'error'){
    let sent = probFull.replace(/〈[^〉]*〉/g, '').replace(/[\t\n]+/g, ' ');
    const pos = sent.indexOf(pa.mark);
    let applied = false;
    if(pos !== -1){
      const head = sent.slice(0, pos);
      const rest = sent.slice(pos + 1);
      const restTrim = rest.replace(/^[\s　]+/, '');
      if(pa.before && restTrim.toLowerCase().startsWith(pa.before.toLowerCase())){
        sent = head + pa.after + restTrim.slice(pa.before.length);
        applied = true;
      } else if(pa.before){
        const k = rest.toLowerCase().indexOf(pa.before.toLowerCase());
        if(k !== -1){
          sent = head + rest.slice(0, k) + pa.after + rest.slice(k + pa.before.length);
          applied = true;
        }
      }
    }
    sentence = sent.replace(TB_CIRC_G, '');
    if(!applied){ sentence = '⚠️ ' + sentence; warn++; }

  } else { // text：整序・語句補充など。解答の英文がそのまま完成文
    sentence = pa.english.replace(/[（(][^）)]*不要[）)]/g, '');
    if(!sentence.trim()){ sentence = '⚠️ 英文が見つかりません'; warn++; }
    const jp = tbProblemJapanese(probFull);
    if(jp){
      translation = jp;     // 問題文に和文があればそれを優先
    } else if(/(という意味を表|を表すので|と考える|に注意|で「[^」]*」という意味)/.test(translation)){
      translation = '⚠️ ' + translation; warn++;   // 訳ではなく解説を拾った可能性
    }
  }

  sentence = sentence.replace(/\*/g, '').replace(/\s+([.,?!;:])/g, '$1').replace(/\s{2,}/g, ' ').trim();
  if(!translation){ translation = '⚠️ 和訳が見つかりません'; warn++; }
  return {sentence:sentence, translation:translation, warn:warn};
}

function generateTextbook(problemText, answerText){
  const P = tbParse(problemText, false);
  const A = tbParse(answerText, true);
  const ansMap = {};
  A.forEach(st => st.sections.forEach(sc => sc.items.forEach(it => {
    ansMap[st.no + '|' + sc.key + '|' + it.num] = it;
  })));
  const out = [];
  let warnings = 0, count = 0;
  P.forEach(st => {
    if(!st.sections.some(sc => sc.items.length)) return;
    if(out.length) out.push('');
    out.push(st.title || ('STEP ' + st.no));
    st.sections.forEach(sc => {
      if(!sc.items.length) return;
      out.push('');
      out.push(sc.key === 'FRAME' ? 'FRAME' : 'EXERCISE ' + sc.key);
      sc.items.forEach(it => {
        const r = tbBuild(it, ansMap[st.no + '|' + sc.key + '|' + it.num]);
        warnings += r.warn;
        count++;
        out.push(`${it.label})　${r.sentence}; ${r.translation}`);
      });
    });
  });
  return {text:out.join('\n'), warnings:warnings, count:count};
}

function generate(){
  const problemText = document.getElementById('problemInput').value;
  const answerText = document.getElementById('answerInput').value;

  if(!problemText.trim() || !answerText.trim()){
    setStatus('問題と解答の両方を貼り付けてください。', true);
    return;
  }

  // 教科書形式（STEP / FRAME / EXERCISE）なら専用の解析に切り替える
  if(isTextbookFormat(problemText)){
    const r = generateTextbook(problemText, answerText);
    document.getElementById('output').value = r.text;
    if(r.count === 0){
      setStatus('問題が1件も見つかりませんでした。問題文の貼り付け内容を確認してください。', true);
    } else if(r.warnings > 0){
      setStatus(`教科書形式で ${r.count} 問を生成しました。⚠️ が ${r.warnings} 箇所あります。出力欄で確認・修正してください。`, true);
    } else {
      setStatus(`教科書形式で ${r.count} 問を生成しました。内容を確認してください。`, false);
    }
    return;
  }

  let warnings = 0;
  const outputLines = [];

  // Title: first line of problem text, cut at first run of 2+ spaces
  const firstLine = problemText.split('\n')[0] || '';
  const title = firstLine.split(/\s{2,}/)[0].trim() || firstLine.trim();
  outputLines.push(title);

  const probSections = splitMajorSections(problemText);
  const ansSections = splitMajorSections(answerText);

  // Build the ordered list of section keys actually present (any circled-number sections found,
  // in numeric order, followed by Give It a Try if present) rather than assuming exactly ①-④.
  const numericKeys = Object.keys(probSections).filter(k => k !== 'give').sort(numSort);
  const sectionKeys = numericKeys.concat(probSections['give'] ? ['give'] : []);
  const sectionLabels = {give: '[Give It a Try!]'};
  numericKeys.forEach(k => { sectionLabels[k] = CIRCLED_DIGITS[parseInt(k,10)-1] || (`(${k})`); });

  sectionKeys.forEach(key=>{
    if(!probSections[key] || !ansSections[key]) return;
    outputLines.push('');
    outputLines.push(sectionLabels[key]);

    try{
      if(key !== 'give'){
        const ansSec = ansSections[key];
        const kaisetsuIdx = ansSec.search(/解説/);
        const answerListPart = kaisetsuIdx !== -1 ? ansSec.slice(0, kaisetsuIdx) : ansSec;

        const answerItems = extractNumberedItems(answerListPart);
        const yakuItems = getTranslationItems(probSections[key], ansSec);
        const problemItems = extractNumberedItems(probSections[key]);
        const letterOptions = extractLetterOptions(probSections[key]);

        let nums = Object.keys(problemItems).sort(numSort);
        if(nums.length === 0) nums = Object.keys(answerItems).sort(numSort);

        nums.forEach(n=>{
          const pText = problemItems[n] || '';
          let sentence, translation;
          const rawAnswerStr = (answerItems[n] || '').trim();
          const letterKey = rawAnswerStr.toLowerCase();

          // The real blank-to-fill (if any) lives in the sentence itself — build that sentence by
          // merging every line that's actually part of it (a wrapped continuation included) and
          // dropping only pure Japanese-cue / word-bank / hint-only lines.
          // Exception: a "choose from the box" (lettered options) item is always single-sentence,
          // and if it's the final numbered item it may have swallowed the trailing option list as
          // part of its raw text — so that type always uses the first line instead.
          const lastLine = normalizeLineBlanks(buildSentenceCandidate(pText));

          if(Object.keys(letterOptions).length && /^[a-h]$/.test(letterKey) && letterOptions[letterKey]){
            // TYPE D: "choose a phrase from the box" — answer is a single letter mapping to an option list
            const firstLine = normalizeLineBlanks(firstLineTrim(pText));
            sentence = fillBlanks(firstLine, [letterOptions[letterKey]]);
            translation = (yakuItems[n] && yakuItems[n].trim()) || extractJapaneseUpToPeriod(pText);

          } else if(lastLine.includes(BLANK_TOKEN)){
            // A blank marker exists — but the answer key might supply either just the missing
            // fragment, or the whole rebuilt sentence (parens marking the inserted part). Decide
            // by checking whether the answer overlaps the fixed wording around the blank.
            let englishTemplate = lastLine;
            const wordBankMatch = englishTemplate.match(/[（(][^（）()]*[，,][^（）()]*[）)]/);
            if(wordBankMatch){
              englishTemplate = englishTemplate.slice(0, wordBankMatch.index);
            }
            // drop a trailing footnote gloss (e.g. "genius「天才」") that isn't inside parens
            const footIdx = englishTemplate.search(FOOTNOTE_MARK_RE);
            if(footIdx !== -1) englishTemplate = englishTemplate.slice(0, footIdx);
            englishTemplate = englishTemplate.replace(/\s{2,}/g, ' ').trim();

            const blankCount = (englishTemplate.match(new RegExp(BLANK_TOKEN.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')) || []).length;
            const parts = englishTemplate.split(BLANK_TOKEN);
            const prefix = (parts[0] || '').trim();
            const suffix = (parts[parts.length-1] || '').trim().replace(/[.,!?]+$/, '');
            const cleanedRawAnswerStr = buildFullSentence(rawAnswerStr);
            const cleanedAnswer = cleanedRawAnswerStr.toLowerCase().replace(/[.,!?]+$/, '');

            const looksLikeFullSentence =
              (prefix.length >= 3 && cleanedAnswer.startsWith(prefix.toLowerCase())) ||
              (suffix.length >= 3 && cleanedAnswer.endsWith(suffix.toLowerCase()));

            if(looksLikeFullSentence && rawAnswerStr){
              sentence = cleanedRawAnswerStr;
            } else {
              // With exactly one blank, use the whole cleaned answer as-is — splitting it on
              // commas or slashes would wrongly break up a single answer like ", when" (the
              // comma is meaningful) or "X. / Y." (two full alternative sentences).
              let answersForItem;
              if(blankCount === 1){
                answersForItem = cleanedRawAnswerStr ? [cleanedRawAnswerStr] : [];
              } else {
                answersForItem = cleanedRawAnswerStr.split(/[,，・\/／]/).map(s=>s.trim()).filter(Boolean);
                if(answersForItem.length !== blankCount){
                  const byWhitespace = cleanedRawAnswerStr.split(/\s+/).map(s=>s.trim()).filter(Boolean);
                  if(byWhitespace.length === blankCount){
                    answersForItem = byWhitespace;
                  }
                }
              }
              if(answersForItem.length === 0){
                sentence = '⚠️ ' + englishTemplate;
                warnings++;
              } else {
                sentence = fillBlanks(englishTemplate, answersForItem);
                if(sentence.indexOf('⚠️') !== -1) warnings++;
              }
            }
            translation = (yakuItems[n] && yakuItems[n].trim()) || extractJapaneseUpToPeriod(pText);

          } else if(containsJapanese(pText) || hasCommaWordBank(pText)){
            // TYPE B: Japanese cue and/or scrambled word bank, no separate blank; answer holds the built sentence
            const rawAns = answerItems[n];
            if(!rawAns){
              sentence = '⚠️ 解答が見つかりません';
              warnings++;
            } else {
              sentence = buildFullSentence(rawAns);
            }
            translation = (yakuItems[n] && yakuItems[n].trim()) || extractJapaneseUpToPeriod(pText);

          } else {
            // TYPE C: problem already gives the complete English sentence; answer is the Japanese translation
            sentence = firstLineTrim(pText);
            if(!sentence){
              sentence = '⚠️ 英文が見つかりません';
              warnings++;
            }
            translation = (yakuItems[n] && yakuItems[n].trim()) || (answerItems[n] ? answerItems[n].trim() : '');
          }

          if(!translation){
            translation = '⚠️ 和文が見つかりません';
            warnings++;
          }
          if(sentence){
            sentence = sentence.replace(/\*/g, '').replace(/\s{2,}/g, ' ').trim();
          }
          outputLines.push(`${n})　${sentence}; ${translation}`);
        });

      } else if(key === 'give'){
        // normalize "例)" into "0)" so it can be handled by the same numbered-item logic
        const probGive = probSections[key].replace(/例\)/, '0)');
        const ansGive = ansSections[key].replace(/例\)/, '0)');

        const yakuIdx = ansGive.search(/訳/);
        const answerListPart = yakuIdx !== -1 ? ansGive.slice(0, yakuIdx) : ansGive;

        const answerItems = extractNumberedItems(answerListPart);
        const translationItems = getTranslationItems(probGive, ansGive);

        const nums = Object.keys(answerItems).sort(numSort);
        nums.forEach(n=>{
          const rawAns = answerItems[n];
          const sentence = buildFullSentence(rawAns);
          const translation = translationItems[n] ? translationItems[n].trim() : '⚠️ 訳が見つかりません';
          if(!translationItems[n]) warnings++;
          const label = (n === '0') ? '例)' : n + ')';
          outputLines.push(`${label}　${sentence}; ${translation}`);
        });
      }
    } catch(e){
      outputLines.push(`⚠️ このセクションは自動解析に失敗しました（${e.message}）。手動で編集してください。`);
      warnings++;
    }
  });

  document.getElementById('output').value = outputLines.join('\n');
  if(warnings > 0){
    setStatus(`生成しました。⚠️ が ${warnings} 箇所あります。出力欄で確認・修正してください。`, true);
  } else {
    setStatus('生成しました。内容を確認してください。', false);
  }
}
</script>
