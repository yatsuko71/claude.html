<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>テアゲ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233E63DD'/%3E%3Crect x='19.5' y='27' width='26' height='24' rx='10' fill='%23fff'/%3E%3Cg stroke='%23fff' stroke-width='5.6' stroke-linecap='round'%3E%3Cline x1='23' y1='31' x2='23' y2='16.5'/%3E%3Cline x1='29.8' y1='30' x2='29.8' y2='11.5'/%3E%3Cline x1='36.6' y1='30' x2='36.6' y2='12.5'/%3E%3Cline x1='43' y1='32' x2='43' y2='18.5'/%3E%3Cline x1='21.5' y1='43' x2='14' y2='34.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!-- 端末間通信（WebRTC）ライブラリと、参加用QRコード生成ライブラリ -->
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#F6F4EF; --card:#fff; --ink:#1d1d1f; --sub:#6b6b6b; --line:#E4E1D8; --line2:#d3cfc3;
  --brand:#3E63DD; --ok:#2F9E6E; --ok-t:#E7F5EE; --ng:#E5484D; --ng-t:#FDECEC;
  --a:#E5484D; --a-t:#FDECEC; --a-b:#F5C2C3;
  --b:#3E63DD; --b-t:#EBF0FD; --b-b:#C3D0F6;
  --c:#D9930D; --c-t:#FDF4E1; --c-b:#F1D79E;
  --d:#2F9E6E; --d-t:#E7F5EE; --d-b:#B4DEC8;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}

/* ---------- 共通部品 ---------- */
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:.55em 1.05em;font-weight:700;line-height:1.2;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#3557c8}
.btn.danger{color:#c4252b}
.btn.quiet{background:transparent;border-color:transparent;color:var(--sub)}
.btn.quiet:hover{background:rgba(0,0,0,.05)}
.btn.small{padding:.35em .7em;font-size:.88em}
.btn.big{font-size:20px;padding:.6em 1.4em;border-radius:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7em 1.2em;border-radius:10px;z-index:99;font-weight:700;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.key{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--k);color:#fff;font-weight:900;flex:none;width:1.6em;height:1.6em;font-size:.9em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:.3em;border-radius:999px;padding:.2em .75em;font-weight:700;font-size:.85em;background:var(--card);border:1.5px solid var(--line);color:var(--sub);white-space:nowrap}
.logo{display:inline-flex;align-items:center;gap:.35em;font-weight:900;letter-spacing:.04em;color:var(--ink);line-height:1}
.logo svg{width:1.25em;height:1.25em;flex:none}

/* ---------- 入口 ---------- */
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.hero .logo{font-size:clamp(44px,9vw,76px)}
.hero p{color:var(--sub);margin:.8em 0 2.2em;font-weight:700}
.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;width:min(560px,100%)}
.entry button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px 20px;text-align:left;display:flex;gap:14px;align-items:center;transition:border-color .15s}
.entry button:hover{border-color:var(--brand)}
.entry .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:none;background:var(--kt);color:var(--k)}
.entry b{display:block;font-size:20px}
.entry small{color:var(--sub);font-weight:700}

/* ---------- 先生の管理画面 ---------- */
.page{max-width:920px;margin:0 auto;padding:16px 16px 80px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 18px}
.topbar .logo{font-size:24px}
.topbar h2{margin:0;font-size:20px;flex:1}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.set-row .info{flex:1;min-width:180px}
.set-row .title{font-weight:900;font-size:18px}
.set-row .meta{color:var(--sub);font-size:14px;font-weight:700;margin-top:2px}
.empty{color:var(--sub);text-align:center;padding:30px}
.title-input{width:100%;font-size:20px;font-weight:900;padding:.5em .7em;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.qcard .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qcard .qhead b{font-size:16px}
.qcard .qhead .sp{flex:1}
.qcard textarea{width:100%;min-height:60px;padding:.55em .7em;border:1.5px solid var(--line);border-radius:10px;resize:vertical;font-size:16px;background:var(--bg)}
.qcard select{padding:.3em .4em;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.choices-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ch-edit{display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 8px;background:var(--kt);border:1.5px solid var(--kb)}
.ch-edit .key{font-size:15px}
.ch-edit input[type=text]{flex:1;min-width:0;border:0;border-radius:7px;padding:.45em .6em;font-size:15px;background:rgba(255,255,255,.85)}
.ch-edit .cor{display:flex;align-items:center;gap:3px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--sub)}
.ch-edit .cor input{width:17px;height:17px;margin:0;accent-color:var(--k)}
.ch-edit.is-correct{border:2px solid var(--k)}
.ch-edit.is-correct .cor{color:var(--k)}
.tf-edit{display:flex;gap:10px;margin-top:8px}
.tfb{flex:1;border-radius:10px;background:var(--kt);border:1.5px solid var(--kb);font-size:20px;font-weight:900;padding:.45em;color:var(--sub)}
.tfb .g{color:var(--k);font-size:1.3em;margin-right:.2em}
.tfb.on{border:2px solid var(--k);color:var(--ink)}
.text-edit{margin-top:8px}
.text-edit input{width:100%;padding:.55em .7em;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg)}
.qwarn{color:#c4252b;font-size:13px;margin-top:6px;font-weight:700}
.qwarn:empty{display:none}
.csv-box textarea{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:.5em;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.help{color:var(--sub);font-size:13px;line-height:1.7}
.help code{background:var(--bg);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.savestate{color:var(--sub);font-size:13px;font-weight:700}
@media (max-width:600px){.choices-edit{grid-template-columns:1fr}}

/* ---------- ロビー ---------- */
.lobby{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px 18px 18px;gap:14px}
.bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-top .logo{font-size:22px}
.bar-top .ttl{flex:1;font-weight:700;color:var(--sub);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.join-panel{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 28px}
.join-panel .lbl{font-size:16px;color:var(--sub);font-weight:700}
.pin{font-size:clamp(60px,11vw,120px);font-weight:900;letter-spacing:.06em;line-height:1.05;font-variant-numeric:tabular-nums}
.join-url{font-size:14px;word-break:break-all;color:var(--sub);max-width:440px;font-weight:700}
.qr img{width:170px;height:170px;image-rendering:pixelated;display:block}
.status{font-weight:700;font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:.4em}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.status.ok::before{background:var(--ok)}
.status.err{color:#c4252b}
.status.err::before{background:var(--ng)}
.lobby-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.count{font-size:28px;font-weight:900}
.count small{font-size:16px;color:var(--sub);margin-left:.2em}
.opts{display:flex;gap:16px;flex-wrap:wrap;flex:1}
.opts label{display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer;color:var(--sub);font-size:15px}
.opts input{width:17px;height:17px;accent-color:var(--brand)}
.players{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.pchip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:.25em .9em .25em .35em;font-weight:900;font-size:clamp(20px,2.3vw,28px);animation:pop .25s;display:flex;align-items:center;gap:.3em}
.pchip .ic{font-size:1.2em;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:50%}
.pchip.off{opacity:.4}
.pchip:hover{border-color:var(--ng);text-decoration:line-through}
.waiting{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-weight:700;gap:6px;text-align:center}
.waiting .dots{display:flex;gap:8px;margin-bottom:6px}
.waiting .dots i{width:10px;height:10px;border-radius:50%;background:var(--line2);animation:blink 1.2s infinite}
.waiting .dots i:nth-child(2){animation-delay:.2s}.waiting .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{background:var(--brand)}}
.warn-box{background:var(--c-t);border:1.5px solid var(--c-b);color:#6b4b00;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6;font-weight:700}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}

/* ---------- 出題画面（プロジェクター向け。文字は枠に合わせて自動で縮む） ---------- */
.game{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:1.2vh 1.4vw 1.6vh;gap:1.4vh}
.g-head{flex:0 0 auto;display:flex;align-items:center;gap:1vw;font-size:min(2.4vh,1.6vw)}
.g-head .logo{font-size:1.25em}
.g-head .grow{flex:1}
.g-head .pill{font-size:1em}
.g-head .btn{font-size:.95em}
.q-text{flex:0 0 25vh;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1.3;overflow:hidden;padding:0 2vw}
.fit{display:block;width:100%;white-space:pre-wrap;overflow-wrap:normal;word-break:normal}
.fit.brk{overflow-wrap:anywhere}
.meta{flex:0 0 auto;display:flex;align-items:center;gap:2vw;font-size:min(3vh,2.1vw);font-weight:900;min-height:6vh}
.tbar{flex:1;height:1.1vh;min-height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--ink);border-radius:99px}
.tbar.hurry i{background:var(--ng)}
.secs{font-variant-numeric:tabular-nums;width:2.4em;text-align:right}
.secs.hurry{color:var(--ng)}
.done{color:var(--sub);white-space:nowrap}
.done b{color:var(--ink);font-variant-numeric:tabular-nums}
.meta .verdict{flex:1;display:flex;align-items:center;gap:.5em}
.meta .btn{font-size:min(2.6vh,1.8vw)}
.ans-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:1.4vh 1vw}
.ans-grid.two{grid-template-rows:minmax(0,1fr)}
.ans{background:var(--kt);border:.35vh solid var(--kb);border-radius:2vh;display:flex;align-items:center;gap:1.4vw;padding:1vh 1.8vw;font-weight:900;line-height:1.25;position:relative;overflow:hidden;min-height:0;transition:opacity .4s,background .3s}
.ans .key{width:min(8.5vh,6vw);height:min(8.5vh,6vw);font-size:min(4.6vh,3.3vw)}
.ans .txt{flex:1;min-width:0}
.ans.blank{visibility:hidden}
.ans .cnt{flex:none;font-size:min(4vh,2.8vw);font-weight:900;color:var(--sub);font-variant-numeric:tabular-nums}
.ans .prop{position:absolute;left:0;bottom:0;height:.9vh;background:var(--k);opacity:.35;transition:width .8s ease}
.ans.correct{background:var(--k);border-color:var(--k);color:#fff}
.ans.correct .key{background:#fff;color:var(--k)}
.ans.correct .cnt{color:#fff}
.ans.correct .prop{background:#fff;opacity:.45}
.ans.dim{opacity:.35}
.ans.tfbox{justify-content:center}
.ans.tfbox .tfg{font-size:min(28vh,17vw);line-height:1;color:var(--k);font-weight:900}
.ans.tfbox.correct .tfg{color:#fff}
.ans.tfbox .cnt{position:absolute;right:2vw;bottom:2vh}
.text-panel{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;border:.35vh dashed var(--line2);border-radius:2vh;font-size:min(5vh,3.6vw);font-weight:900;color:var(--sub);text-align:center;padding:2vh}
.text-panel .pen{width:min(16vh,11vw);height:min(16vh,11vw);border-radius:50%;background:var(--b-t);color:var(--b);display:flex;align-items:center;justify-content:center;font-size:min(9vh,6vw)}
.ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;min-height:0}
.ready .pill{font-size:min(3vh,2.2vw)}
.ready .q-text{flex:0 0 45vh;width:100%}
.ready-bar{width:min(520px,60vw);height:1vh;min-height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.ready-bar i{display:block;height:100%;background:var(--ink);width:0;animation:fill 3.5s linear forwards}
@keyframes fill{to{width:100%}}
.accept{flex:0 0 auto;background:var(--ok-t);border:.35vh solid #B4DEC8;color:#1d6b49;border-radius:2vh;padding:1.2vh 2vw;font-size:min(5vh,3.6vw);font-weight:900;text-align:center;line-height:1.3;word-break:break-word}
.accept.survey{background:var(--card);border-color:var(--line);color:var(--sub)}
.groups{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.4vh 1vw}
.grp{background:var(--card);border:.3vh solid var(--line);border-radius:1.6vh;padding:.3em .8em;font-size:min(4.8vh,3.4vw);font-weight:900;display:flex;gap:.45em;align-items:center;max-width:100%;word-break:break-word;text-align:left;animation:pop .3s}
.grp.ok{background:var(--ok-t);border-color:var(--ok);color:#1d6b49}
.grp .cnt{background:var(--bg);color:var(--sub);border-radius:999px;padding:0 .5em;font-size:.62em;flex:none}
.grp.ok .cnt{background:#fff;color:var(--ok)}
.grp[disabled]{cursor:default}
.hint{font-size:min(2.4vh,1.7vw);color:var(--sub);font-weight:700}
.foot-row{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;gap:1vw}
.foot-row .btn{font-size:min(3vh,2.1vw)}

/* ---------- ランキング・結果 ---------- */
.board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;overflow:auto}
.board h2{font-size:min(5.4vh,4vw);margin:1vh 0 3vh;font-weight:900;text-align:center}
.rank-list{width:min(900px,94vw);display:flex;flex-direction:column;gap:1.2vh}
.rank-item{background:var(--card);border:.3vh solid var(--line);border-radius:1.8vh;padding:1.2vh 1.8vw;display:flex;align-items:center;gap:1.4vw;font-size:min(4.6vh,3.2vw);font-weight:900;animation:slide .35s}
.rank-item.top{border-color:var(--c-b);background:#FFFBF2}
@keyframes slide{from{transform:translateY(14px)}to{transform:none}}
.rank-item .r{width:1.5em;height:1.5em;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.8em;flex:none}
.rank-item.top .r{background:var(--c);color:#fff}
.rank-item .ic{font-size:1.1em}
.rank-item .nm{flex:1;word-break:break-all}
.rank-item .plus{font-size:.6em;color:var(--ok);background:var(--ok-t);border-radius:999px;padding:.1em .6em}
.rank-item .sc{font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.6vw;margin:1vh 0 3vh}
.pod{display:flex;flex-direction:column;align-items:center;width:min(230px,27vw)}
.pod .ic{font-size:min(9vh,6.6vw);line-height:1.15}
.pod .nm{font-size:min(4.2vh,3vw);font-weight:900;text-align:center;word-break:break-all}
.pod .sc{font-weight:700;color:var(--sub);margin:.4vh 0 1vh;font-size:min(2.8vh,2vw)}
.pod .block{width:100%;border-radius:1.8vh 1.8vh 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:min(7vh,5vw);font-weight:900;padding-top:1.2vh;animation:rise .7s both;border:.3vh solid;border-bottom:0}
.pod.p1 .block{height:21vh;background:#FFF3D3;border-color:#F1D79E;color:#9a6a06}
.pod.p2 .block{height:14vh;background:#EEF0F3;border-color:#D5D9E0;color:#5b6270}
.pod.p3 .block{height:9vh;background:#FBEBDD;border-color:#EECBAB;color:#9a5a24}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.final-table{width:min(900px,94vw);background:var(--card);border:1.5px solid var(--line);border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;margin-bottom:16px;font-size:min(2.6vh,1.9vw);font-weight:700}
.final-table th,.final-table td{padding:.7vh 1.4vw;border-bottom:1px solid var(--line);text-align:left}
.final-table tr:last-child td{border-bottom:0}
.final-table th{color:var(--sub);font-size:.85em}

/* ---------- 生徒画面 ---------- */
.pl{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;transition:background .3s}
.pl.ok{background:var(--ok-t)}
.pl.ng{background:var(--ng-t)}
.pl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
.pl-foot{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-top:1.5px solid var(--line);padding:10px 16px;font-weight:900;font-size:18px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.pl-foot .who{display:flex;align-items:center;gap:8px}
.pl-foot .who .ic{font-size:26px}
.pl-foot .sc{font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:.1em .8em}
.join-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px;width:min(380px,94vw);display:flex;flex-direction:column;gap:12px;text-align:left}
.join-card input{font-size:24px;text-align:center;padding:.45em;border:1.5px solid var(--line);border-radius:12px;font-weight:900;width:100%;background:var(--bg)}
.join-card input:focus{outline:none;border-color:var(--brand)}
.join-card .lbl{font-weight:700;font-size:14px;color:var(--sub)}
.icon-row{display:flex;align-items:center;gap:10px}
.icon-preview{font-size:44px;line-height:1;width:62px;height:62px;flex:none;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.icon-row input{flex:1;min-width:0}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:168px;overflow:auto;padding:4px;border:1.5px solid var(--line);border-radius:12px}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ==========================================================
   テアゲ — 単一HTMLの早押しクイズ（先生画面＋生徒画面）
   通信: PeerJS（WebRTC）。先生のブラウザが親機になり、PINで生徒とつながる
   問題形式: 選択式（2〜4択）／○×／記述式（正解なしならアンケート）
   ========================================================== */

const APP_NAME = 'テアゲ';
const PEER_PREFIX = 'teage-quiz-v1-';      // 公開サーバー上で他アプリとIDが衝突しないための接頭辞
const LS_SETS = 'hayaoshi.sets.v1';        // 以前の版で作ったクイズをそのまま引き継ぐ
const LS_NAME = 'hayaoshi.name';
const LS_ICON = 'hayaoshi.icon';
const SS_CID = 'hayaoshi.cid';
const READY_MS = 3500;                     // 問題文を先に見せる時間
const TEXT_MAX = 40;                       // 記述式の最大文字数
const TIME_OPTIONS = [5, 10, 20, 30, 60, 90, 120];
const CH = ['a', 'b', 'c', 'd'].map((x, j) => ({ L: 'ABCD'[j], style: `--k:var(--${x});--kt:var(--${x}-t);--kb:var(--${x}-b)` }));
const TF = [{ glyph: '○', style: CH[1].style }, { glyph: '×', style: CH[0].style }];
const TYPE_LABEL = { choice: '選択式', tf: '○×', text: '記述式' };
const ICONS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔',
  '🐧', '🐤', '🦉', '🐴', '🦄', '🐝', '🐞', '🦋', '🐢', '🐙', '🦀', '🐬', '🐳', '🦈', '🦒', '🐘',
  '🦔', '🌸', '🌻', '🍀', '🍎', '🍓', '🍙', '🍣', '🍩', '🍦', '⚽', '⚾', '🏀', '🎸', '🚀', '🚃',
  '⭐', '🌈', '⛄', '🔥', '💎', '👑', '🤖', '👻'];
const LOGO_SVG = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#3E63DD"/><rect x="19.5" y="27" width="26" height="24" rx="10" fill="#fff"/><g stroke="#fff" stroke-width="5.6" stroke-linecap="round"><line x1="23" y1="31" x2="23" y2="16.5"/><line x1="29.8" y1="30" x2="29.8" y2="11.5"/><line x1="36.6" y1="30" x2="36.6" y2="12.5"/><line x1="43" y1="32" x2="43" y2="18.5"/><line x1="21.5" y1="43" x2="14" y2="34.5"/></g></svg>`;
const logo = () => `<span class="logo">${LOGO_SVG}${APP_NAME}</span>`;

const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const key = j => `<span class="key" style="${CH[j].style}">${CH[j].L}</span>`;
const dots = '<div class="dots"><i></i><i></i><i></i></div>';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));

function toast(msg, ms = 2200) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* 枠に収まるまで文字を小さくする（プロジェクター表示用） */
function fitBox(box, maxPx, minPx) {
  if (!box) return minPx;
  const inner = box.querySelector('.fit') || box;
  inner.classList.remove('brk');
  const cs = getComputedStyle(box);
  const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.round(maxPx);
  const over = () => inner.scrollHeight > availH + 1 || inner.scrollWidth > inner.clientWidth + 1;
  box.style.fontSize = s + 'px';
  while (s > minPx && over()) { s -= 2; box.style.fontSize = s + 'px'; }
  if (over()) inner.classList.add('brk');   // 最小でも入らない長い単語は途中で折り返す
  return s;
}

/* ---------- 保存（ブラウザのlocalStorage） ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function normQuestion(q) {
  q = q || {};
  const type = ['choice', 'tf', 'text'].includes(q.type) ? q.type : 'choice';
  const choices = Array.isArray(q.choices) ? q.choices.slice(0, 4).map(c => String(c ?? '')) : [];
  while (choices.length < 4) choices.push('');
  let correct = Number(q.correct); if (!(correct >= 0 && correct <= 3)) correct = 0;
  if (type === 'tf' && correct > 1) correct = 0;
  const answers = Array.isArray(q.answers) ? q.answers.map(a => String(a).trim()).filter(Boolean) : [];
  let time = Number(q.time); if (!(time >= 3)) time = 20;
  return { type, q: String(q.q ?? ''), choices, correct, answers, time };
}
function sampleSet() {
  return {
    id: uid(), title: '英単語クイズ（サンプル）', questions: [
      { type: 'choice', q: 'apple の意味は？', choices: ['りんご', 'みかん', 'ぶどう', 'もも'], correct: 0, time: 20 },
      { type: 'choice', q: '「図書館」を英語で言うと？', choices: ['hospital', 'library', 'station', 'museum'], correct: 1, time: 20 },
      { type: 'tf', q: '"run" の過去形は "runned" である。', correct: 1, time: 10 },
      { type: 'text', q: '「ねこ」を英語で書くと？', answers: ['cat', 'a cat'], time: 30 },
      { type: 'choice', q: '正しい英文はどれ？', choices: ['He go to school.', 'He going to school.', 'He gone to school.', 'He goes to school.'], correct: 3, time: 30 },
      { type: 'text', q: '好きな英単語をひとつ書こう！（アンケート）', answers: [], time: 30 }
    ].map(normQuestion)
  };
}
let sets = store.get(LS_SETS, null);
if (!Array.isArray(sets)) sets = [sampleSet()];
sets = sets.map(s => ({ id: s.id || uid(), title: String(s.title ?? ''), questions: (s.questions || []).map(normQuestion) }));
store.set(LS_SETS, sets);
function saveSets() { if (!store.set(LS_SETS, sets)) toast('保存できませんでした。ブラウザの設定を確認してください'); }
function newQuestion(type = 'choice') { return normQuestion({ type, correct: 0, time: type === 'text' ? 30 : 20 }); }

/* 記述式の答え合わせ用：全角半角・大文字小文字・空白・末尾の句読点の違いを無視 */
function normAnswer(s) {
  return String(s ?? '').normalize('NFKC').toLowerCase().replace(/\s+/g, '').replace(/[。．.！!？?、,]+$/, '');
}
function splitAnswers(s) { return String(s ?? '').split(/[\/／|｜]/).map(x => x.trim()).filter(Boolean); }
function isSurvey(q) { return q.type === 'text' && !q.answers.length; }
function correctLabel(q) {
  if (q.type === 'tf') return TF[q.correct].glyph;
  if (q.type === 'text') return q.answers.join(' ／ ');
  return `${CH[q.correct].L}　${q.choices[q.correct]}`;
}

/* 問題のチェック。問題なければ空文字を返す */
function questionProblem(q) {
  if (!q.q.trim()) return '問題文が空です';
  if (q.type === 'choice') {
    const filled = q.choices.filter(c => c.trim()).length;
    if (filled < 2) return '選択肢を2つ以上入力してください';
    if (!q.choices[q.correct] || !q.choices[q.correct].trim()) return '正解に選んだ選択肢が空です';
  }
  return '';
}

/* ---------- CSV（タブ区切りも可） ---------- */
function parseDelimited(text) {
  const delim = /\t/.test(text.split(/\r?\n/).find(l => l.trim()) || '') ? '\t' : ',';
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') inQ = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const z2h = s => String(s || '').trim().replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
function parseChoiceAnswer(v, choices) {
  const s = z2h(v);
  if (/^[1-4]$/.test(s)) return Number(s) - 1;
  if (/^[A-Da-d]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  return choices.findIndex(c => c.trim() && c.trim() === s);
}
function parseTf(v) {
  const s = z2h(v);
  if (/^([○◯〇Oo]|正|正しい|true|t)$/i.test(s)) return 0;
  if (/^([×xX✕✖]|誤|まちがい|false|f)$/i.test(s)) return 1;
  return -1;
}
function importCsv(text) {
  const rows = parseDelimited(text);
  const out = [], errors = [];
  rows.forEach((r, n) => {
    const cells = r.map(c => c.trim());
    if (n === 0 && /^(問題|問題文|question|q)$/i.test(cells[0])) return; // 見出し行
    const choices = [cells[1] || '', cells[2] || '', cells[3] || '', cells[4] || ''];
    let time = parseInt(z2h(cells[6]).replace(/[^\d]/g, ''), 10);
    if (!time || time < 3) time = 20;
    if (time > 300) time = 300;
    // 形式：8列目で指定。なければ自動判定（選択肢が空なら ○×／記述）
    const tcol = cells[7] || '';
    let type = /記述|text/i.test(tcol) ? 'text' : /○|×|まるばつ|tf/i.test(tcol) ? 'tf' : /選択|choice/i.test(tcol) ? 'choice' : '';
    if (!type) type = choices.some(c => c) ? 'choice' : (parseTf(cells[5]) >= 0 ? 'tf' : 'text');
    let q, prob = '';
    if (type === 'choice') {
      const c = parseChoiceAnswer(cells[5], choices);
      q = normQuestion({ type, q: cells[0], choices, correct: c < 0 ? 0 : c, time });
      prob = c < 0 ? '正解の指定（1〜4 か A〜D）が読み取れません' : questionProblem(q);
    } else if (type === 'tf') {
      const c = parseTf(cells[5]);
      q = normQuestion({ type, q: cells[0], correct: c < 0 ? 0 : c, time });
      prob = c < 0 ? '○×の正解（○ か ×）が読み取れません' : questionProblem(q);
    } else {
      q = normQuestion({ type, q: cells[0], answers: splitAnswers(cells[5]), time });
      prob = questionProblem(q);
    }
    if (prob) errors.push(`${n + 1}行目: ${prob}`);
    else out.push(q);
  });
  return { out, errors };
}
function csvCell(v) { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadText(filename, text) {
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function safeFile(s) { return String(s).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || 'quiz'; }

/* ---------- 効果音（Web Audio） ---------- */
let actx = null;
function beep(freq, dur = .12, type = 'sine', vol = .18, delay = 0) {
  if (!H || !H.opts.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) { }
}
const sfx = {
  join() { beep(660, .08, 'triangle'); beep(990, .1, 'triangle', .15, .07); },
  tick() { beep(880, .05, 'square', .07); },
  end() { beep(523, .15, 'triangle'); beep(659, .15, 'triangle', .18, .12); beep(784, .3, 'triangle', .18, .24); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => beep(f, .25, 'triangle', .18, i * .15)); }
};

/* ==========================================================
   入口画面
   ========================================================== */
function showLanding() {
  app.innerHTML = `
  <div class="center hero">
    ${logo()}
    <p>みんなで手を挙げる、教室の早押しクイズ</p>
    <div class="entry">
      <button id="goHost"><span class="ic" style="${CH[1].style}">先</span><span><b>先生</b><small>クイズを作る・出題する</small></span></button>
      <button id="goJoin"><span class="ic" style="${CH[3].style}">生</span><span><b>生徒</b><small>PINで参加する</small></span></button>
    </div>
  </div>`;
  $('#goHost').onclick = showHostHome;
  $('#goJoin').onclick = () => showJoin('');
}

/* ==========================================================
   先生：クイズ一覧
   ========================================================== */
function showHostHome() {
  const list = sets.map(s => {
    const kinds = ['choice', 'tf', 'text'].map(t => [t, s.questions.filter(q => q.type === t).length]).filter(x => x[1]).map(([t, n]) => `${TYPE_LABEL[t]} ${n}`).join('・');
    return `
    <div class="card set-row" data-id="${s.id}">
      <div class="info"><div class="title">${esc(s.title || '（無題）')}</div>
        <div class="meta">${s.questions.length}問${kinds ? `　${kinds}` : ''}</div></div>
      <button class="btn primary" data-act="play">出題する</button>
      <button class="btn" data-act="edit">編集</button>
      <button class="btn quiet small" data-act="dup">複製</button>
      <button class="btn quiet small danger" data-act="del">削除</button>
    </div>`;
  }).join('');
  app.innerHTML = `
  <div class="page">
    <div class="topbar">
      <button class="btn quiet small" id="back">← 戻る</button>
      ${logo()}
      <h2></h2>
      <button class="btn primary" id="newSet">＋ 新しいクイズ</button>
    </div>
    ${list || '<div class="empty">まだクイズがありません。「新しいクイズ」から作りましょう。</div>'}
    <p class="help">クイズはこのブラウザの中に保存されます（別のPCやブラウザからは見えません）。バックアップや共有には、編集画面の「CSVで書き出し」を使ってください。</p>
  </div>`;
  $('#back').onclick = showLanding;
  $('#newSet').onclick = () => {
    const s = { id: uid(), title: '新しいクイズ', questions: [newQuestion()] };
    sets.unshift(s); saveSets(); showEditor(s.id);
  };
  $$('.set-row').forEach(row => row.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    const id = row.dataset.id, s = sets.find(x => x.id === id);
    if (act === 'play') startHosting(id);
    if (act === 'edit') showEditor(id);
    if (act === 'dup') { const c = clone(s); c.id = uid(); c.title += '（コピー）'; sets.splice(sets.indexOf(s) + 1, 0, c); saveSets(); showHostHome(); }
    if (act === 'del' && confirm(`「${s.title}」を削除しますか？`)) { sets = sets.filter(x => x.id !== id); saveSets(); showHostHome(); }
  }));
}

/* ==========================================================
   先生：クイズ編集
   ========================================================== */
function showEditor(id) {
  const s = sets.find(x => x.id === id);
  if (!s) return showHostHome();
  let saveTimer = null;
  const autosave = () => {
    $('#saveState').textContent = '編集中…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveSets(); const el = $('#saveState'); if (el) el.textContent = '保存しました'; }, 400);
  };

  const bodyHtml = (q, i) => {
    if (q.type === 'tf') return `
      <div class="tf-edit">${TF.map((t, j) => `<button class="tfb ${q.correct === j ? 'on' : ''}" data-act="tf" data-v="${j}" style="${t.style}"><span class="g">${t.glyph}</span>が正解</button>`).join('')}</div>`;
    if (q.type === 'text') return `
      <div class="text-edit"><input type="text" data-f="answers" value="${esc(q.answers.join(' / '))}" placeholder="正解（複数あるときは / で区切る　例：cat / a cat）"></div>
      <p class="help" style="margin:4px 0 0">全角・半角、大文字・小文字、空白の違いは同じ答えとみなします。出題中に先生がタップして正解を追加することもできます。<b>空欄にするとアンケート</b>（得点なし・みんなの答えを表示するだけ）になります。</p>`;
    return `
      <div class="choices-edit">
        ${[0, 1, 2, 3].map(j => `
        <div class="ch-edit ${q.correct === j ? 'is-correct' : ''}" style="${CH[j].style}">
          ${key(j)}
          <input type="text" data-f="c${j}" value="${esc(q.choices[j])}" placeholder="選択肢 ${CH[j].L}${j >= 2 ? '（空欄可）' : ''}">
          <label class="cor"><input type="radio" name="cor${i}" data-f="correct" value="${j}" ${q.correct === j ? 'checked' : ''}>正解</label>
        </div>`).join('')}
      </div>`;
  };
  const qHtml = (q, i) => `
    <div class="card qcard" data-i="${i}">
      <div class="qhead">
        <b>Q${i + 1}</b>
        <select data-f="type">${['choice', 'tf', 'text'].map(t => `<option value="${t}" ${q.type === t ? 'selected' : ''}>${{ choice: '選択式（2〜4択）', tf: '○×', text: '記述式' }[t]}</option>`).join('')}</select>
        <select data-f="time" aria-label="制限時間">${TIME_OPTIONS.concat(TIME_OPTIONS.includes(q.time) ? [] : [q.time]).sort((a, b) => a - b).map(t => `<option value="${t}" ${t === q.time ? 'selected' : ''}>${t}秒</option>`).join('')}</select>
        <span class="sp"></span>
        <button class="btn quiet small" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="上へ">↑</button>
        <button class="btn quiet small" data-act="down" ${i === s.questions.length - 1 ? 'disabled' : ''} aria-label="下へ">↓</button>
        <button class="btn quiet small" data-act="copy">複製</button>
        <button class="btn quiet small danger" data-act="del">削除</button>
      </div>
      <textarea data-f="q" placeholder="${q.type === 'tf' ? '○か×で答える文を入力' : '問題文を入力'}">${esc(q.q)}</textarea>
      ${bodyHtml(q, i)}
      <div class="qwarn">${esc(questionProblem(q))}</div>
    </div>`;

  function render() {
    app.innerHTML = `
    <div class="page">
      <div class="topbar">
        <button class="btn quiet small" id="back">← 一覧へ</button>
        <h2>クイズを編集</h2>
        <span class="savestate" id="saveState">保存済み</span>
        <button class="btn primary" id="play">出題する</button>
      </div>
      <div class="card"><input class="title-input" id="title" value="${esc(s.title)}" placeholder="クイズのタイトル"></div>
      <div id="qs">${s.questions.map(qHtml).join('')}</div>
      <div class="row-btns">
        <button class="btn" data-add="choice">＋ 選択式</button>
        <button class="btn" data-add="tf">＋ ○×</button>
        <button class="btn" data-add="text">＋ 記述式</button>
      </div>
      <div class="card csv-box" style="margin-top:22px">
        <b>表から取り込む（CSV・Excel貼り付け）</b>
        <p class="help">1行に1問。<code>問題,選択肢A,選択肢B,選択肢C,選択肢D,正解,制限時間(秒),形式</code><br>
        Excelやスプレッドシートの表をそのままコピーして貼り付けてもOK。制限時間を省略すると20秒。「形式」は省略可（自動で判定）。<br>
        ・選択式：正解は 1〜4 か A〜D。選択肢C・Dは空欄可　例：<code>dog の意味は？,ねこ,いぬ,とり,うま,B,20</code><br>
        ・○×：選択肢を空欄にして正解に ○ か ×　例：<code>犬は英語でdogである。,,,,,○,10</code><br>
        ・記述式：選択肢を空欄にして正解を書く（複数は / で区切る）　例：<code>「ねこ」を英語で？,,,,,cat / a cat,30</code><br>
        ・アンケート：記述式で正解を空欄にして形式に「記述」　例：<code>好きな教科は？,,,,,,30,記述</code></p>
        <textarea id="csv" placeholder="ここに貼り付け"></textarea>
        <div class="row-btns">
          <button class="btn primary" id="impAdd">末尾に追加</button>
          <button class="btn" id="impRep">全部置き換え</button>
          <button class="btn quiet" id="exp">CSVで書き出し</button>
        </div>
        <div class="qwarn" id="impErr"></div>
      </div>
    </div>`;
    $('#back').onclick = () => { saveSets(); showHostHome(); };
    $('#play').onclick = () => { saveSets(); startHosting(s.id); };
    $('#title').oninput = e => { s.title = e.target.value; autosave(); };
    $$('[data-add]').forEach(b => b.onclick = () => {
      s.questions.push(newQuestion(b.dataset.add)); saveSets(); render();
      const cards = $$('.qcard'), last = cards[cards.length - 1];
      last.scrollIntoView({ behavior: 'smooth', block: 'center' });
      last.querySelector('textarea').focus();
    });
    $('#qs').addEventListener('input', onField);
    $('#qs').addEventListener('change', onField);
    $('#qs').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const card = btn.closest('.qcard'), i = Number(card.dataset.i), act = btn.dataset.act, qs = s.questions;
      if (act === 'tf') {
        qs[i].correct = Number(btn.dataset.v);
        $$('.tfb', card).forEach((b, j) => b.classList.toggle('on', j === qs[i].correct));
        autosave(); return;
      }
      if (act === 'up' && i > 0) [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]];
      if (act === 'down' && i < qs.length - 1) [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]];
      if (act === 'copy') qs.splice(i + 1, 0, clone(qs[i]));
      if (act === 'del') { if (!confirm(`Q${i + 1} を削除しますか？`)) return; qs.splice(i, 1); }
      saveSets(); render();
    });
    const doImport = replace => {
      const { out, errors } = importCsv($('#csv').value);
      if (!out.length) { $('#impErr').textContent = errors.length ? errors.join(' / ') : '取り込める行がありません'; return; }
      if (replace && !confirm(`今の${s.questions.length}問を消して、${out.length}問に置き換えますか？`)) return;
      s.questions = replace ? out : s.questions.filter(q => q.q.trim() || q.choices.some(c => c.trim()) || q.answers.length).concat(out);
      saveSets(); render();
      toast(`${out.length}問を取り込みました${errors.length ? `（${errors.length}行はスキップ）` : ''}`);
      if (errors.length) $('#impErr').textContent = 'スキップした行: ' + errors.join(' / ');
    };
    $('#impAdd').onclick = () => doImport(false);
    $('#impRep').onclick = () => doImport(true);
    $('#exp').onclick = () => {
      const lines = ['問題,選択肢A,選択肢B,選択肢C,選択肢D,正解,制限時間,形式'];
      s.questions.forEach(q => {
        const row = q.type === 'choice' ? [q.q, ...q.choices, CH[q.correct].L, q.time, '選択']
          : q.type === 'tf' ? [q.q, '', '', '', '', TF[q.correct].glyph, q.time, '○×']
            : [q.q, '', '', '', '', q.answers.join(' / '), q.time, '記述'];
        lines.push(row.map(csvCell).join(','));
      });
      downloadText(`${stamp()}${safeFile(s.title)}.csv`, lines.join('\r\n'));
    };
  }
  function onField(e) {
    const f = e.target.dataset.f; if (!f) return;
    const card = e.target.closest('.qcard'), i = Number(card.dataset.i), q = s.questions[i];
    if (f === 'type') {
      if (e.type !== 'change') return;
      q.type = e.target.value;
      if (q.type === 'tf' && q.correct > 1) q.correct = 0;
      saveSets(); render(); return;
    }
    if (f === 'q') q.q = e.target.value;
    else if (f === 'time') q.time = Number(e.target.value);
    else if (f === 'answers') q.answers = splitAnswers(e.target.value);
    else if (f === 'correct') {
      q.correct = Number(e.target.value);
      $$('.ch-edit', card).forEach((el, j) => el.classList.toggle('is-correct', j === q.correct));
    } else if (/^c[0-3]$/.test(f)) q.choices[Number(f[1])] = e.target.value;
    card.querySelector('.qwarn').textContent = questionProblem(q);
    autosave();
  }
  render();
}

/* ==========================================================
   先生：ゲーム進行（親機）
   ========================================================== */
let H = null; // 先生側の状態

function startHosting(setId) {
  const s = sets.find(x => x.id === setId);
  if (!s) return;
  if (!s.questions.length) { toast('問題がありません'); return; }
  const bad = s.questions.findIndex(q => questionProblem(q));
  if (bad >= 0) { toast(`Q${bad + 1}: ${questionProblem(s.questions[bad])}`, 3500); showEditor(setId); return; }
  H = {
    set: clone(s), opts: { shuffleQ: false, showOnDevice: false, sound: true },
    players: new Map(), kicked: new Set(), phase: 'lobby', order: [], idx: -1,
    answers: new Map(), qStart: 0, timer: null, tickTimer: null, survey: false,
    pin: '', peer: null, status: 'connecting', errType: ''
  };
  openHostPeer(0);
  renderHost();
}

function genPin() { return String(Math.floor(100000 + Math.random() * 900000)); }

function openHostPeer(tries) {
  if (typeof Peer === 'undefined') { H.status = 'nolib'; updateStatus(); return; }
  const pin = genPin();
  H.pin = pin; H.status = 'connecting';
  const peer = new Peer(PEER_PREFIX + pin);
  H.peer = peer;
  peer.on('open', () => { if (H && H.peer === peer) { H.status = 'ready'; if (H.phase === 'lobby') renderHost(); else updateStatus(); } });
  peer.on('connection', conn => { if (H && H.peer === peer) setupHostConn(conn); });
  peer.on('disconnected', () => {
    // 仲介サーバーとの接続だけが切れた状態。生徒との接続は生きているので再接続を試みる
    if (!H || H.peer !== peer || peer.destroyed) return;
    H.status = 'reconnecting'; updateStatus();
    setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) { } }, 1500);
  });
  peer.on('error', err => {
    if (!H || H.peer !== peer) return;
    if (err.type === 'unavailable-id' && tries < 5) { peer.destroy(); openHostPeer(tries + 1); return; }
    if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'unavailable-id', 'ssl-unavailable'].includes(err.type)) {
      H.status = 'error'; H.errType = err.type; updateStatus();
    } else console.warn('peer error', err);
  });
}

function statusHtml() {
  const map = {
    connecting: ['接続準備中…', ''],
    ready: ['参加受付中', 'ok'],
    reconnecting: ['再接続中…', ''],
    nolib: ['通信ライブラリを読み込めませんでした。インターネット接続を確認してください', 'err'],
    error: [`接続エラー（${esc(H.errType)}）`, 'err']
  };
  const [t, c] = map[H.status] || ['', ''];
  return `<span class="status ${c}">${t}</span>${H.status === 'error' || H.status === 'nolib' ? ' <button class="btn small" id="retryPeer">やり直す</button>' : ''}`;
}
function updateStatus() {
  const el = $('#peerStatus'); if (!el) return;
  el.innerHTML = statusHtml();
  const r = $('#retryPeer');
  if (r) r.onclick = () => {
    if (H.phase !== 'lobby' && !confirm('接続をやり直すとPINが変わり、生徒は入り直しが必要です。よろしいですか？')) return;
    try { H.peer && H.peer.destroy(); } catch (e) { }
    openHostPeer(0); renderHost();
  };
}

function send(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) { } }
function onlinePlayers() { return [...H.players.values()].filter(p => p.online); }

function setupHostConn(conn) {
  conn.on('data', d => onHostData(conn, d));
  const gone = () => {
    if (!H) return;
    for (const p of H.players.values()) if (p.conn === conn) { p.online = false; p.conn = null; }
    refreshPlayersUi();
    if (H.phase === 'question') { updateDone(); checkAllAnswered(); }
  };
  conn.on('close', gone);
  conn.on('error', gone);
}

function cleanName(n) { return String(n ?? '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 12); }
function uniqueName(name) {
  const used = new Set([...H.players.values()].map(p => p.name));
  if (!used.has(name)) return name;
  for (let k = 2; ; k++) if (!used.has(`${name}(${k})`)) return `${name}(${k})`;
}

function onHostData(conn, d) {
  if (!H || !d || typeof d !== 'object') return;
  if (d.t === 'join') {
    const cid = String(d.cid || '').slice(0, 40);
    const name = cleanName(d.name);
    const icon = ICONS.includes(d.icon) ? d.icon : ICONS[0];
    if (!cid || !name) { send(conn, { t: 'err', msg: '名前を入力してください' }); return; }
    if (H.kicked.has(cid)) { send(conn, { t: 'kick' }); setTimeout(() => conn.close(), 400); return; }
    let p = H.players.get(cid);
    if (p) {
      const old = p.conn;
      p.conn = conn; p.online = true;            // 先に差し替えてから古い接続を閉じる
      if (old && old !== conn) { try { old.close(); } catch (e) { } }
    } else {
      if (H.phase === 'final') { send(conn, { t: 'err', msg: 'このゲームはもう終わっています' }); return; }
      p = { cid, name: uniqueName(name), icon, score: 0, correctCount: 0, qres: [], conn, online: true, lastPts: 0, lastCorrect: false, lastAnswered: false, rank: 1 };
      H.players.set(cid, p);
      if (H.phase === 'lobby') sfx.join();
    }
    conn.cid = cid;
    send(conn, { t: 'welcome', name: p.name, icon: p.icon, title: H.set.title });
    syncPlayer(p);
    refreshPlayersUi();
    if (H.phase === 'question') updateDone();
  } else if (d.t === 'a') {
    const p = H.players.get(conn.cid);
    if (p && p.conn === conn) handleAnswer(p, d);
  }
}

/* 途中参加・再接続した生徒に、今の状態を送る */
function syncPlayer(p) {
  const c = p.conn;
  switch (H.phase) {
    case 'lobby': send(c, { t: 'lobby' }); break;
    case 'ready': send(c, { t: 'ready', i: H.idx, n: H.order.length, type: curQ().type }); break;
    case 'question': {
      const a = H.answers.get(p.cid);
      if (a) send(c, { t: 'answered', pick: pickLabel(curQ(), a) });
      else send(c, qPayload(Math.max(0, curQ().time * 1000 - (performance.now() - H.qStart))));
      break;
    }
    case 'reveal': case 'board': send(c, resultPayload(p)); break;
    case 'final': send(c, endPayload(p)); break;
  }
}

function curQ() { return H.set.questions[H.order[H.idx]]; }
function availIdx(q) {
  if (q.type === 'tf') return [0, 1];
  if (q.type === 'text') return [];
  return [0, 1, 2, 3].filter(j => q.choices[j] && q.choices[j].trim());
}
function pickLabel(q, a) {
  if (!a) return null;
  if (q.type === 'text') return { s: a.s };
  return { c: a.c };
}
function qPayload(remainMs) {
  const q = curQ();
  return {
    t: 'q', i: H.idx, n: H.order.length, type: q.type, avail: availIdx(q), time: q.time, remain: Math.round(remainMs),
    survey: isSurvey(q),
    text: H.opts.showOnDevice ? q.q : null, choices: H.opts.showOnDevice && q.type === 'choice' ? q.choices : null
  };
}
function ranking() {
  const arr = [...H.players.values()].sort((a, b) => b.score - a.score);
  let rank = 0, prev = null;
  arr.forEach((p, i) => { if (p.score !== prev) { rank = i + 1; prev = p.score; } p.rank = rank; });
  return arr;
}
function resultPayload(p) {
  const q = curQ(), r = p.qres[H.idx] || {};
  return {
    t: 'r', i: H.idx, type: q.type, survey: H.survey, correct: p.lastCorrect, answered: p.lastAnswered, pts: p.lastPts,
    score: p.score, rank: p.rank, total: H.players.size, ans: H.survey ? '' : correctLabel(q), pick: pickLabel(q, r.a)
  };
}
function gradedCount() { return H.order.filter(k => !isSurvey(H.set.questions[k])).length; }
function endPayload(p) { return { t: 'end', rank: p.rank, score: p.score, total: H.players.size, correctCount: p.correctCount, n: gradedCount() }; }
function broadcast(msgFn) { for (const p of H.players.values()) if (p.online) send(p.conn, typeof msgFn === 'function' ? msgFn(p) : msgFn); }

function clearTimers() { clearTimeout(H.timer); clearInterval(H.tickTimer); H.timer = null; H.tickTimer = null; }
function resetScores() { for (const p of H.players.values()) Object.assign(p, { score: 0, correctCount: 0, qres: [], lastPts: 0, lastCorrect: false, lastAnswered: false, rank: 1 }); }

function startGame() {
  if (!H.players.size) return;
  H.order = H.set.questions.map((_, i) => i);
  if (H.opts.shuffleQ) for (let i = H.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [H.order[i], H.order[j]] = [H.order[j], H.order[i]]; }
  resetScores();
  H.idx = -1;
  nextQuestion();
}

function nextQuestion() {
  clearTimers();
  H.idx++;
  if (H.idx >= H.order.length) { showFinal(); return; }
  H.phase = 'ready';
  H.answers = new Map();
  H.survey = isSurvey(curQ());
  broadcast({ t: 'ready', i: H.idx, n: H.order.length, type: curQ().type });
  renderHost();
  H.timer = setTimeout(beginAnswering, READY_MS);
}

function beginAnswering() {
  const q = curQ();
  H.phase = 'question';
  H.qStart = performance.now();
  broadcast(() => qPayload(q.time * 1000));
  renderHost();
  let lastSec = q.time;
  H.tickTimer = setInterval(() => {
    const remain = q.time * 1000 - (performance.now() - H.qStart);
    const sec = Math.max(0, Math.ceil(remain / 1000));
    const hurry = sec <= 5;
    const bar = $('#tbar'), secs = $('#secs');
    if (bar) { bar.firstElementChild.style.width = Math.max(0, remain / (q.time * 1000) * 100) + '%'; bar.classList.toggle('hurry', hurry); }
    if (secs) { secs.textContent = sec; secs.classList.toggle('hurry', hurry); }
    if (sec !== lastSec) { lastSec = sec; if (hurry && sec > 0) sfx.tick(); }
    if (remain <= 0) endQuestion();
  }, 100);
}

function updateDone() {
  const el = $('#done'); if (!el) return;
  el.innerHTML = `<b>${H.answers.size}</b> / ${onlinePlayers().length} 人が回答`;
}

function handleAnswer(p, d) {
  if (H.phase !== 'question' || d.i !== H.idx || H.answers.has(p.cid)) return;
  const q = curQ();
  let a;
  if (q.type === 'text') {
    const s = String(d.s ?? '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, TEXT_MAX);
    if (!s) return;
    a = { s };
  } else {
    const c = Number(d.c);
    if (!availIdx(q).includes(c)) return;
    a = { c };
  }
  a.ms = performance.now() - H.qStart;
  H.answers.set(p.cid, a);
  send(p.conn, { t: 'answered', pick: pickLabel(q, a) });
  updateDone();
  checkAllAnswered();
}
function checkAllAnswered() {
  const on = onlinePlayers();
  if (on.length && on.every(p => H.answers.has(p.cid))) setTimeout(endQuestion, 400);
}

function judge(q, a) {
  if (!a) return false;
  if (q.type === 'text') { const n = normAnswer(a.s); return q.answers.some(x => normAnswer(x) === n); }
  return a.c === q.correct;
}
/* 今の問題を採点（記述式で正解を追加・取り消ししたときも呼び直す） */
function scoreCurrent() {
  const q = curQ(), limit = q.time * 1000;
  for (const p of H.players.values()) {
    const a = H.answers.get(p.cid);
    const ok = !H.survey && judge(q, a);
    // 正解なら 500〜1000点。速いほど高得点
    const pts = ok ? Math.round(1000 * (1 - Math.min(a.ms / limit, 1) / 2)) : 0;
    p.qres[H.idx] = { a: a || null, ok, pts };
    p.score = p.qres.reduce((t, r) => t + (r ? r.pts : 0), 0);
    p.correctCount = p.qres.filter(r => r && r.ok).length;
    p.lastPts = pts; p.lastCorrect = ok; p.lastAnswered = !!a;
  }
  ranking();
}

function endQuestion() {
  if (!H || H.phase !== 'question') return;
  clearTimers();
  scoreCurrent();
  H.phase = 'reveal';
  broadcast(p => resultPayload(p));
  sfx.end();
  renderHost();
}

/* 記述式：答えのグループをタップして正解/不正解を切り替える */
function toggleTextGroup(norm, raw) {
  const q = curQ();
  if (q.answers.some(x => normAnswer(x) === norm)) q.answers = q.answers.filter(x => normAnswer(x) !== norm);
  else q.answers.push(raw);
  scoreCurrent();
  broadcast(p => resultPayload(p));
  renderHost();
}

function showBoard() { H.phase = 'board'; renderHost(); }
function showFinal() {
  clearTimers();
  ranking();
  H.phase = 'final';
  broadcast(p => endPayload(p));
  sfx.fanfare();
  renderHost();
}
function backToLobby() {
  clearTimers();
  H.phase = 'lobby'; H.idx = -1;
  resetScores();
  broadcast({ t: 'lobby' });
  renderHost();
}
function closeHosting() {
  if (!H) return;
  clearTimers();
  broadcast({ t: 'closed' });
  const peer = H.peer;
  setTimeout(() => { try { peer && peer.destroy(); } catch (e) { } }, 300);
  H = null;
  showHostHome();
}
function downloadResults() {
  const arr = ranking();
  const qs = H.order.map(k => H.set.questions[k]);
  const head = ['順位', 'アイコン', '名前', '得点', '正解数', ...qs.map((q, i) => `Q${i + 1}(${TYPE_LABEL[q.type]}) ${q.q.replace(/\s+/g, ' ').slice(0, 20)}`)];
  const lines = [head.map(csvCell).join(',')];
  arr.forEach(p => lines.push([p.rank, p.icon, p.name, p.score, p.correctCount, ...qs.map((q, i) => {
    const r = p.qres[i];
    if (!r || !r.a) return '-';
    const mark = isSurvey(q) ? '' : (r.ok ? '○' : '×');
    if (q.type === 'text') return `${mark}${mark ? ' ' : ''}${r.a.s}`;
    if (q.type === 'tf') return `${mark}（${TF[r.a.c].glyph}）`;
    return `${mark}（${CH[r.a.c].L}）`;
  })].map(csvCell).join(',')));
  downloadText(`${stamp()}${safeFile(H.set.title)}_結果.csv`, lines.join('\r\n'));
}

/* ---------- 先生画面の描画 ---------- */
function joinUrl() { return location.href.split('#')[0].split('?')[0] + '?pin=' + H.pin; }
function qrHtml(url) {
  if (typeof qrcode !== 'function') return '';
  try { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); return qr.createImgTag(5, 8, '参加用QRコード'); } catch (e) { return ''; }
}
function vmin(wRatio, hRatio) { return Math.min(innerWidth * wRatio, innerHeight * hRatio); }

/* 選択肢パネル（選択式・○×）。reveal のときは人数と割合も出す */
function ansGridHtml(q, mode) {
  const reveal = mode === 'reveal';
  const counts = [0, 0, 0, 0];
  if (reveal) for (const a of H.answers.values()) counts[a.c]++;
  const total = Math.max(1, H.answers.size);
  const extra = j => reveal ? `<span class="cnt">${counts[j]}人</span><span class="prop" style="width:${counts[j] / total * 100}%"></span>` : '';
  const cls = j => reveal ? (j === q.correct ? 'correct' : 'dim') : '';
  if (q.type === 'tf') {
    return `<div class="ans-grid two">${TF.map((t, j) => `
      <div class="ans tfbox ${cls(j)}" style="${t.style}"><span class="tfg">${t.glyph}</span>${extra(j)}</div>`).join('')}</div>`;
  }
  return `<div class="ans-grid">${[0, 1, 2, 3].map(j => {
    const blank = !q.choices[j] || !q.choices[j].trim();
    return `<div class="ans ${blank ? 'blank' : ''} ${cls(j)}" style="${CH[j].style}">${key(j)}<span class="txt fit">${esc(q.choices[j])}</span>${extra(j)}</div>`;
  }).join('')}</div>`;
}

/* 文字サイズを画面に合わせる */
function fitHost() {
  if (!H || H.phase === 'lobby') return;
  $$('.q-text').forEach(el => fitBox(el, vmin(.06, .09), 18));
  const boxes = $$('.ans:not(.blank):not(.tfbox)');
  if (boxes.length) {
    const size = Math.min(...boxes.map(b => fitBox(b, vmin(.05, .075), 16)));
    boxes.forEach(b => { b.style.fontSize = size + 'px'; fitBox(b, size, 16); });
  }
}
window.addEventListener('resize', () => { clearTimeout(fitHost._t); fitHost._t = setTimeout(fitHost, 120); });

function renderHost() {
  if (!H) return;

  } else if (ph === 'final') {

    const pod = (p, cls) => p ? `<div class="pod ${cls}"><div class="ic">${p.icon}</div><div class="nm">${esc(p.name)}</div><div class="sc">${p.score}点</div><div class="block">${p.rank}</div></div>` : `<div class="pod ${cls}"></div>`;
    const n = gradedCount();
    app.innerHTML = `<div class="game">${head('結果発表', false)}

  } catch (e) { toast('この端末では全画面にできません。iPadは共有メニューの「ホーム画面に追加」から開くと全画面になります', 4000); }
}

function showJoin(pin, errMsg = '') {

      <div class="icon-row"><span class="icon-preview" id="iconPrev">${icon}</span><input id="nm" maxlength="12" placeholder="なまえ" value="${esc(savedName)}"></div>
      <div class="icon-grid" id="iconGrid">${ICONS.map(ic => `<button type="button" class="${ic === icon ? 'on' : ''}" data-ic="${ic}" aria-label="アイコン ${ic}">${ic}</button>`).join('')}</div>
      <button class="btn primary big" type="submit">参加する</button>

  const back = $('#back'); if (back) back.onclick = () => { history.replaceState(null, '', location.pathname); showLanding(); };
  $('#iconGrid').onclick = e => {

  };

function plScreen(inner, opts = {}) {
  app.innerHTML = `<div class="pl ${opts.cls || ''}">
    ${inner}
    <div class="pl-foot"><span class="who"><span class="ic">${P ? P.icon : ''}</span>${esc(P ? P.name : '')}</span><span class="sc">${P ? P.score : 0}</span></div>
  </div>`;
}
function plMsg(big, mid = '', wait = false, cls = '', top = '') {
  plScreen(`<div class="pl-main">${top}${wait ? dots : ''}<div class="big-msg">${big}</div>${mid ? `<div class="mid-msg">${mid}</div>` : ''}</div>`, { cls });
}
function pickChip(pick) {
  if (!pick) return '';
  if (pick.s != null) return `<span class="chip">${esc(pick.s)}</span>`;
  if (P.curType === 'tf') return `<span class="chip" style="${TF[pick.c].style}"><span style="color:var(--k)">${TF[pick.c].glyph}</span></span>`;
  return `<span class="chip">${key(pick.c)}</span>`;
}

function leavePeer() {
  if (!P) return;
  clearTimeout(P.connTimer); clearInterval(P.barTimer);
  const peer = P.peer; P.peer = null; P.conn = null;
  try { peer && peer.destroy(); } catch (e) { }
}

function joinGame(pin, name, icon) {
  if (P) leavePeer();
  P = { pin, name, icon, cid: getCid(), peer: null, conn: null, score: P && P.pin === pin ? P.score : 0, ended: false, curI: -1, curType: 'choice' };
  plMsg('接続中…', '', true);
  if (typeof Peer === 'undefined') { showJoin(pin, '通信ライブラリを読み込めませんでした。インターネット接続を確認してください。'); return; }
  const me = P;
  const fail = msg => { if (P !== me) return; leavePeer(); showJoin(pin, msg); };
  me.connTimer = setTimeout(() => fail('接続できませんでした。PINを確認するか、少し待ってからもう一度試してください。（学校のネットワークで通信が制限されている可能性もあります）'), 15000);
  const peer = new Peer();
  me.peer = peer;
  peer.on('open', () => {
    if (P !== me) return;
    const conn = peer.connect(PEER_PREFIX + pin, { reliable: true });
    me.conn = conn;
    conn.on('open', () => { clearTimeout(me.connTimer); send(conn, { t: 'join', cid: me.cid, name: me.name, icon: me.icon }); });
    conn.on('data', d => { if (P === me) onPlayerData(d); });
    const lost = () => {
      if (P !== me || me.ended || !me.conn) return;
      me.conn = null;
      plScreen(`<div class="pl-main"><div class="big-msg">接続が切れました</div><div class="mid-msg">もう一度つなぎ直してください</div><button class="btn primary big" id="rejoin">再接続する</button></div>`);
      $('#rejoin').onclick = () => joinGame(me.pin, me.name, me.icon);
    };
    conn.on('close', lost);
    conn.on('error', lost);
  });
  peer.on('error', err => {
    if (P !== me) return;
    if (err.type === 'peer-unavailable') fail('そのPINのゲームが見つかりません。番号を確認してください。');
    else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable'].includes(err.type)) {
      if (!me.conn || !me.conn.open) fail('接続できませんでした（' + err.type + '）。インターネット接続を確認してください。');
    }
  });
}

function onPlayerData(d) {
  if (!d || typeof d !== 'object') return;
  clearInterval(P.barTimer);
  if (d.type) P.curType = d.type;
  switch (d.t) {
    case 'welcome':
      P.name = d.name; P.icon = d.icon || P.icon; P.title = d.title;
      break;
    case 'lobby':
      P.score = 0;
      plMsg('参加しました', `先生の画面に名前が出ているか確認してね<br>まもなく始まります`, false, '', `<div class="me-icon">${P.icon}</div><div class="big-msg" style="font-size:26px">${esc(P.name)}</div>`);
      break;
    case 'ready':
      plMsg(`Q${d.i + 1}`, `${TYPE_LABEL[d.type] || ''}　先生の画面を見てね`, true);
      break;
    case 'q': renderAnswerPad(d); break;
    case 'answered':
      plMsg('回答しました', 'みんなの回答を待っています', true, '', pickChip(d.pick));
      break;
    case 'r': {
      P.score = d.score;
      const mine = d.pick ? `<div class="mid-msg">あなたの答え　${pickChip(d.pick)}</div>` : '';
      const ans = d.ans ? `<div class="mid-msg">正解　<b style="color:var(--ink)">${esc(d.ans)}</b></div>` : '';
      const rank = `<div class="mid-msg">いま <b style="color:var(--ink)">${d.rank}位</b> / ${d.total}人</div>`;
      if (d.survey) plScreen(`<div class="pl-main"><div class="badge-circle" style="${CH[1].style}">✎</div><div class="big-msg">${d.answered ? '送信ありがとう' : '時間切れ'}</div>${mine}<div class="mid-msg">先生の画面でみんなの答えを見よう</div></div>`);
      else if (!d.answered) plScreen(`<div class="pl-main"><div class="badge-circle" style="--k:#9a978e">–</div><div class="big-msg">時間切れ</div>${ans}${rank}</div>`, { cls: 'ng' });
      else if (d.correct) plScreen(`<div class="pl-main"><div class="badge-circle" style="--k:var(--ok)">✓</div><div class="big-msg">正解！</div><div class="pts">+${d.pts}</div>${mine}${rank}</div>`, { cls: 'ok' });
      else plScreen(`<div class="pl-main"><div class="badge-circle" style="--k:var(--ng)">✕</div><div class="big-msg">ざんねん</div>${mine}${ans}${rank}</div>`, { cls: 'ng' });
      break;
    }
    case 'end': {
      P.score = d.score;
      const medal = { 1: '--k:#D9930D', 2: '--k:#8a919e', 3: '--k:#C0773A' }[d.rank] || '--k:var(--brand)';
      plScreen(`<div class="pl-main"><div class="mid-msg">結果発表</div><div class="badge-circle" style="${medal};font-size:52px">${d.rank}<small style="font-size:.4em">位</small></div><div class="big-msg">${P.icon} ${esc(P.name)}</div><div class="mid-msg">${d.total}人中 ${d.rank}位　${d.score}点<br>正解 ${d.correctCount} / ${d.n}問</div></div>`);
      break;
    }
    case 'kick':
      P.ended = true; leavePeer();
      plMsg('退出しました', '先生によって退出になりました');
      break;
    case 'closed':
      P.ended = true; leavePeer();
      plScreen(`<div class="pl-main"><div class="big-msg">ゲームが終了しました</div><div class="mid-msg">参加ありがとう！</div><button class="btn" id="toJoin">別のゲームに参加</button></div>`);
      $('#toJoin').onclick = () => { history.replaceState(null, '', location.pathname); P = null; showJoin(''); };
      break;
    case 'err':
      P.ended = true; { const pin = P.pin; leavePeer(); showJoin(pin, d.msg || 'エラー'); }
      break;
  }
}

function renderAnswerPad(d) {
  P.curI = d.i;
  const head = `<div class="pl-qhead"><span>Q${d.i + 1} / ${d.n}</span><div class="pl-timebar"><i id="bar"></i></div></div>${d.text ? `<div class="pl-qtext">${esc(d.text)}</div>` : ''}`;
  let body;
  if (d.type === 'text') {
    body = `<form class="pl-textform" id="tf" autocomplete="off">
      <div class="lead">${d.survey ? '思ったことを書いてね' : '答えを入力してね'}</div>
      <input id="tans" maxlength="${TEXT_MAX}" placeholder="ここに入力" enterkeyhint="send">
      <button class="btn primary" type="submit">送信する</button>
    </form>`;
  } else if (d.type === 'tf') {
    body = `<div class="pl-grid" style="grid-template-rows:1fr">${TF.map((t, j) => `<button class="pl-btn" data-c="${j}" style="${t.style}"><span class="big" style="font-size:96px">${t.glyph}</span></button>`).join('')}</div>`;
  } else {
    const withText = Array.isArray(d.choices);
    body = `<div class="pl-grid">${[0, 1, 2, 3].map(j => {
      const ok = d.avail.includes(j);
      return `<button class="pl-btn ${ok ? '' : 'blank'} ${withText ? 'with-text' : ''}" data-c="${j}" style="${CH[j].style}" ${ok ? '' : 'disabled'}><span class="big">${CH[j].L}</span>${withText ? `<span>${esc(d.choices[j])}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }
  plScreen(`<div class="pl-q">${head}${body}</div>`);
  const total = d.time * 1000, endAt = performance.now() + d.remain;
  const bar = $('#bar');
  P.barTimer = setInterval(() => {
    const r = Math.max(0, endAt - performance.now());
    bar.style.width = (r / total * 100) + '%';
    if (r <= 0) clearInterval(P.barTimer);
  }, 100);
  const submit = payload => {
    if (!P.conn) return;
    clearInterval(P.barTimer);
    send(P.conn, Object.assign({ t: 'a', i: d.i }, payload));
    plMsg('回答しました', 'みんなの回答を待っています', true, '', pickChip(payload));
  };
  if (d.type === 'text') {
    const inp = $('#tans');
    let composing = false;
    inp.addEventListener('compositionstart', () => composing = true);
    inp.addEventListener('compositionend', () => composing = false);
    $('#tf').onsubmit = e => {
      e.preventDefault();
      if (composing) return;                 // 日本語変換の確定Enterでは送信しない
      const s = inp.value.trim();
      if (!s) { inp.focus(); return; }
      submit({ s });
    };
    inp.focus();
  } else {
    $$('.pl-btn').forEach(b => b.onclick = () => submit({ c: Number(b.dataset.c) }));
  }
}

/* ==========================================================
   起動
   ========================================================== */
(function boot() {
  const pin = new URLSearchParams(location.search).get('pin');
  if (pin) showJoin(pin.replace(/\D/g, '').slice(0, 6));
  else showLanding();
})();
</script>
