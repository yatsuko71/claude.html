<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>はやおしクイズ</title>
<!-- 端末間通信（WebRTC）ライブラリと、参加用QRコード生成ライブラリ -->
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg1:#3b1f8f; --bg2:#22105c; --ink:#1f1f2e; --muted:#6b6b80; --line:#e3e1ee;
  --c0:#e21b3c; --c1:#1368ce; --c2:#d89e00; --c3:#26890c;
  --ok:#26890c; --ng:#e21b3c; --accent:#5b2bd6;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--ink);background:#f4f3f9;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.hidden{display:none!important}
 
/* 共通部品 */
.btn{border:0;border-radius:8px;padding:.6em 1.1em;font-weight:700;background:#e9e6f5;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.go{background:var(--ok);color:#fff}
.btn.danger{background:#fde8eb;color:#b0102a}
.btn.small{padding:.35em .7em;font-size:.88em}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:.7em 1.2em;border-radius:8px;z-index:99;font-weight:700;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.shape{display:inline-flex;width:1.3em;height:1.3em;flex:none}
.shape svg{width:100%;height:100%;fill:#fff}
 
/* 紫背景の画面 */
.stage{min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#fff}
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-size:clamp(36px,8vw,72px);margin:0;letter-spacing:.05em;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.sub{opacity:.85;margin:.4em 0 2em}
.landing-btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.big-btn{border:0;border-radius:14px;padding:28px 40px;min-width:230px;font-size:28px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px}
.big-btn small{font-size:15px;font-weight:600;opacity:.9}
.big-btn.host{background:var(--c1)}
.big-btn.join{background:var(--c3)}
.big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
 
/* 白背景のページ（先生の管理画面） */
.page{max-width:960px;margin:0 auto;padding:16px 16px 80px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar h2{margin:0;font-size:22px;flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.set-row .info{flex:1;min-width:180px}
.set-row .title{font-weight:800;font-size:18px}
.set-row .meta{color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:30px}
 
/* エディタ */
.title-input{width:100%;font-size:20px;font-weight:700;padding:.5em .7em;border:2px solid var(--line);border-radius:8px}
.qcard .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qcard .qhead b{font-size:17px}
.qcard .qhead .sp{flex:1}
.qcard textarea{width:100%;min-height:60px;padding:.5em .7em;border:2px solid var(--line);border-radius:8px;resize:vertical;font-size:16px}
.qcard select{padding:.3em;border-radius:6px;border:1px solid var(--line)}
.type-badge{font-size:12px;font-weight:800;padding:.2em .6em;border-radius:999px;background:#ece6ff;color:var(--accent)}
.choices-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ch-edit{display:flex;align-items:center;gap:6px;border-radius:8px;padding:5px;background:var(--c)}
.ch-edit input[type=text]{flex:1;min-width:0;border:0;border-radius:6px;padding:.45em .6em;font-size:15px}
.ch-edit .cor{display:flex;align-items:center;gap:3px;color:#fff;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;padding:0 4px}
.ch-edit .cor input{width:18px;height:18px;margin:0}
.ch-edit.is-correct{outline:4px solid #111;outline-offset:1px}
.tf-edit{display:flex;gap:10px;margin-top:8px}
.tfb{flex:1;border:0;border-radius:10px;background:var(--c);color:#fff;font-size:22px;font-weight:900;padding:.5em;opacity:.4}
.tfb.on{opacity:1;outline:4px solid #111;outline-offset:1px}
.text-edit{margin-top:8px}
.text-edit input{width:100%;padding:.55em .7em;border:2px solid var(--line);border-radius:8px;font-size:16px}
.qwarn{color:#b0102a;font-size:13px;margin-top:6px;font-weight:700}
.csv-box textarea{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:.5em;border:2px solid var(--line);border-radius:8px}
.help{color:var(--muted);font-size:13px;line-height:1.6}
.help code{background:#f0eef7;padding:1px 4px;border-radius:4px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.savestate{color:var(--muted);font-size:13px}
@media (max-width:600px){.choices-edit{grid-template-columns:1fr}}
 
/* ロビー */
.lobby{min-height:100vh;display:flex;flex-direction:column}
.lobby-head{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.lobby-head .ttl{flex:1;font-weight:800;font-size:20px}
.join-panel{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;color:var(--ink);margin:0 16px;border-radius:14px;padding:16px 24px}
.join-panel .lbl{font-size:18px;color:var(--muted);font-weight:700}
.pin{font-size:clamp(56px,10vw,110px);font-weight:900;letter-spacing:.08em;line-height:1}
.join-url{font-size:14px;word-break:break-all;color:var(--muted);max-width:420px}
.qr img{width:180px;height:180px;image-rendering:pixelated;display:block}
.status{font-weight:700;padding:.4em .8em;border-radius:999px;background:rgba(255,255,255,.15);font-size:14px}
.status.err{background:#ffd5db;color:#8a0016}
.lobby-body{flex:1;padding:16px}
.lobby-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.count{font-size:26px;font-weight:800;background:rgba(0,0,0,.25);padding:.25em .8em;border-radius:10px}
.opts{display:flex;gap:14px;flex-wrap:wrap;flex:1}
.opts label{display:flex;align-items:center;gap:5px;font-weight:600;cursor:pointer}
.players{display:flex;flex-wrap:wrap;gap:12px}
.pchip{background:#fff;color:var(--ink);border:0;border-radius:10px;padding:.35em .9em;font-weight:800;font-size:clamp(20px,2.4vw,30px);animation:pop .25s;display:flex;align-items:center;gap:.3em}
.pchip .ic{font-size:1.25em}
.pchip.off{opacity:.45}
.pchip:hover{text-decoration:line-through}
.waiting-msg{opacity:.8;font-size:20px;margin-top:20px;text-align:center}
.warn-box{background:#fff4d6;color:#6b4b00;border-radius:10px;padding:10px 14px;margin:10px 16px 0;font-size:14px;line-height:1.6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
 
/* 出題画面（先生）— iPadをプロジェクターに映しても読める大きさ。文字は枠に合わせて自動で縮む */
.game{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.game-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:.8vh 1.2vw;font-weight:800;font-size:min(2.6vh,1.8vw)}
.game-head .grow{flex:1}
.q-text{flex:0 0 24vh;background:#fff;color:var(--ink);margin:0 1.2vw;border-radius:12px;padding:1.2vh 2vw;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.3;overflow:hidden}
.fit{display:block;width:100%;white-space:pre-wrap;overflow-wrap:normal;word-break:normal}
.fit.brk{overflow-wrap:anywhere}
.q-mid{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:1.2vh 3vw;gap:2vw}
.q-mid .kind{font-weight:800;font-size:min(3.4vh,2.4vw);opacity:.85}
.timer{width:min(15vh,12vw);height:min(15vh,12vw);border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:min(7.5vh,6vw);font-weight:900;box-shadow:0 0 0 .6vh rgba(255,255,255,.2);flex:none}
.timer.hurry{background:var(--c0);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.answered{text-align:center;font-weight:800;font-size:min(3vh,2.2vw)}
.answered .n{font-size:min(7.5vh,6vw);display:block;line-height:1.1}
.skip-btn{font-size:min(2.6vh,1.8vw)!important}
.ans-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:1.2vh 1vw;padding:0 1.2vw 1.2vh}
.ans-grid.two{grid-template-rows:minmax(0,1fr)}
.ans{background:var(--c);color:#fff;border-radius:12px;display:flex;align-items:center;gap:1.4vw;padding:1vh 1.6vw;font-weight:800;line-height:1.25;text-shadow:0 2px 0 rgba(0,0,0,.2);position:relative;overflow:hidden;min-height:0}
.ans .shape{width:min(8vh,6vw);height:min(8vh,6vw)}
.ans .txt{flex:1;min-width:0}
.ans .mark{font-size:min(8vh,6vw);flex:none}
.ans.dim{opacity:.28}
.ans.blank{visibility:hidden}
.ans.tfbox{justify-content:center}
.ans.tfbox .tfglyph{font-size:min(26vh,16vw);line-height:1;font-weight:900}
.ans.tfbox .mark{position:absolute;right:2vw;top:50%;transform:translateY(-50%)}
.text-panel{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;margin:0 1.2vw 1.2vh;border-radius:12px;background:rgba(255,255,255,.12);font-size:min(6vh,4.4vw);font-weight:900;text-align:center;padding:2vh}
.text-panel .big{font-size:min(16vh,11vw);line-height:1}
.ready-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:2vh 2vw;text-align:center;min-height:0}
.ready-screen .qn{font-size:min(5vh,3.6vw);font-weight:900;opacity:.95}
.ready-screen .q-text{flex:0 0 42vh;margin:0;width:100%}
.ready-bar{width:min(600px,80vw);height:1.2vh;background:rgba(255,255,255,.2);border-radius:1vh;overflow:hidden}
.ready-bar i{display:block;height:100%;background:#fff;width:0;animation:fill 3.5s linear forwards}
@keyframes fill{to{width:100%}}
.dist{flex:0 0 22vh;display:flex;align-items:flex-end;justify-content:center;gap:4vw;padding:1vh 4vw}
.dist .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:min(150px,16vw);height:100%}
.dist .bar{width:100%;background:var(--c);border-radius:6px 6px 0 0;min-height:4px;transition:height .6s}
.dist .lab{background:var(--c);width:100%;border-radius:0 0 6px 6px;display:flex;align-items:center;justify-content:center;gap:.4em;padding:.4vh;font-weight:900;font-size:min(4vh,3vw)}
.dist .lab .shape{width:1em;height:1em}
.dist .col.dim{opacity:.35}
.next-row{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;padding:0 1.2vw 1vh;gap:1vw}
.next-row .hint{flex:1;font-size:min(2.6vh,1.8vw);opacity:.8;font-weight:700}
.next-row .btn.go{font-size:min(3.2vh,2.2vw)}
.accept{flex:0 0 auto;margin:1.2vh 1.2vw 0;background:var(--ok);border-radius:12px;padding:1vh 1.6vw;font-size:min(5.5vh,4vw);font-weight:900;text-align:center;line-height:1.3;word-break:break-word}
.accept.survey{background:rgba(255,255,255,.18)}
.groups{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.2vh 1vw;padding:1.4vh 1.2vw}
.grp{background:#fff;color:var(--ink);border:0;border-radius:12px;padding:.25em .7em;font-size:min(5vh,3.6vw);font-weight:900;display:flex;gap:.4em;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2);max-width:100%;word-break:break-word;text-align:left}
.grp.ok{background:#d9f7cf;outline:.5vh solid #7be35d}
.grp .cnt{background:#333;color:#fff;border-radius:999px;padding:0 .5em;font-size:.65em;flex:none}
.grp .ck{color:var(--ok)}
.grp[disabled]{cursor:default}
 
/* ランキング */
.board{flex:1;display:flex;flex-direction:column;align-items:center;padding:1vh 2vw;overflow:auto;min-height:0}
.board h2{font-size:min(6vh,4.4vw);margin:1vh 0 2.4vh;text-align:center}
.rank-list{width:min(900px,94vw);display:flex;flex-direction:column;gap:1.4vh}
.rank-item{background:#fff;color:var(--ink);border-radius:12px;padding:1.2vh 2vw;display:flex;align-items:center;gap:1.4vw;font-size:min(5vh,3.4vw);font-weight:900;animation:pop .3s both}
.rank-item .r{width:1.6em;text-align:center;color:var(--accent)}
.rank-item .ic{font-size:1.1em}
.rank-item .nm{flex:1;word-break:break-all}
.rank-item .plus{font-size:.6em;color:var(--ok)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;margin:1vh 0 3vh}
.pod{display:flex;flex-direction:column;align-items:center;width:min(240px,28vw)}
.pod .ic{font-size:min(9vh,7vw);line-height:1.1}
.pod .nm{font-size:min(4.6vh,3.4vw);font-weight:900;margin-bottom:.4vh;text-align:center;word-break:break-all}
.pod .sc{font-weight:800;opacity:.9;margin-bottom:.8vh;font-size:min(3vh,2.2vw)}
.pod .block{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:min(8vh,6vw);font-weight:900;padding-top:1vh;animation:rise .8s both}
.pod.p1 .block{height:28vh;background:#f4c430;color:#5a4300}
.pod.p2 .block{height:20vh;background:#c9ced6;color:#3d424a}
.pod.p3 .block{height:14vh;background:#d08b4a;color:#4a2a0c}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.final-table{width:min(900px,94vw);background:#fff;color:var(--ink);border-radius:10px;border-collapse:collapse;overflow:hidden;margin-bottom:16px;font-size:min(2.8vh,2vw)}
.final-table th,.final-table td{padding:.6vh 1.2vw;border-bottom:1px solid var(--line);text-align:left}
.final-table th{background:#f0eef7}
 
/* 生徒画面 */
.pl{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:14px}
.pl-foot{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);padding:10px 16px;font-weight:800;font-size:18px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.pl-foot .who{display:flex;align-items:center;gap:6px}
.pl-foot .who .ic{font-size:26px}
.pl-foot .sc{background:#333;color:#fff;border-radius:6px;padding:.15em .6em}
.join-form{background:#fff;color:var(--ink);border-radius:14px;padding:20px;width:min(380px,94vw);display:flex;flex-direction:column;gap:12px}
.join-form input{font-size:24px;text-align:center;padding:.5em;border:2px solid var(--line);border-radius:8px;font-weight:800;width:100%}
.join-form .btn{font-size:20px;padding:.7em}
.join-form .lbl{font-weight:800;font-size:15px;text-align:left;color:var(--muted)}
.icon-row{display:flex;align-items:center;gap:10px}
.icon-preview{font-size:52px;line-height:1;width:64px;text-align:center}
.icon-row input{flex:1}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:170px;overflow:auto;padding:4px;border:2px solid var(--line);border-radius:8px}
.icon-grid button{font-size:26px;border:0;background:none;border-radius:8px;padding:3px 0;line-height:1.2}
.icon-grid button.on{background:#e0d6ff;outline:2px solid var(--accent)}
.join-err{color:#b0102a;font-weight:700;min-height:1.2em}
.big-msg{font-size:clamp(26px,7vw,44px);font-weight:900;line-height:1.3;word-break:break-word}
.mid-msg{font-size:20px;font-weight:700;opacity:.92;line-height:1.5;word-break:break-word}
.me-icon{font-size:80px;line-height:1}
.spinner{width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-q{flex:1;display:flex;flex-direction:column;padding:10px;gap:10px}
.pl-qtext{background:#fff;color:var(--ink);border-radius:10px;padding:12px;font-weight:800;font-size:18px;text-align:center;white-space:pre-wrap;word-break:break-word}
.pl-timebar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.pl-timebar i{display:block;height:100%;background:#fff;width:100%}
.pl-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.pl-btn{border:0;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.25);font-size:18px;font-weight:800;padding:10px;word-break:break-word;min-height:110px}
.pl-btn .shape{width:30%;height:auto;aspect-ratio:1;max-width:110px}
.pl-btn.with-text .shape{width:2em;height:2em}
.pl-btn .tfglyph{font-size:96px;line-height:1;font-weight:900}
.pl-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pl-btn.blank{visibility:hidden}
.pl-textform{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;padding:0 6px}
.pl-textform .lead{font-size:20px;font-weight:800;text-align:center}
.pl-textform input{font-size:26px;padding:.6em;border-radius:10px;border:0;text-align:center;font-weight:800;width:100%}
.pl-textform .btn{font-size:24px;padding:.7em}
.pl.ok{background:linear-gradient(160deg,#2fa212,#1d6b08)}
.pl.ng{background:linear-gradient(160deg,#e8334f,#9e0c22)}
.res-icon{font-size:90px;line-height:1}
.pts{background:rgba(0,0,0,.25);border-radius:8px;padding:.3em .9em;font-size:26px;font-weight:900}
.your-ans{background:rgba(0,0,0,.2);border-radius:8px;padding:.3em .8em;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div id="app" class="stage"></div>
<div id="toast" class="toast"></div>
 
<script>
'use strict';
/* ==========================================================
   はやおしクイズ — 単一HTMLの早押しクイズ（先生画面＋生徒画面）
   通信: PeerJS（WebRTC）。先生のブラウザが親機になり、PINで生徒とつながる
   問題形式: 選択式（2〜4択）／○×／記述式（正解なしならアンケート）
   ========================================================== */
 
const PEER_PREFIX = 'hayaoshi-quiz-v1-';   // 公開サーバー上で他アプリとIDが衝突しないための接頭辞
const LS_SETS = 'hayaoshi.sets.v1';
const LS_NAME = 'hayaoshi.name';
const LS_ICON = 'hayaoshi.icon';
const SS_CID = 'hayaoshi.cid';
const READY_MS = 3500;                     // 問題文を先に見せる時間
const TEXT_MAX = 40;                       // 記述式の最大文字数
const TIME_OPTIONS = [5, 10, 20, 30, 60, 90, 120];
const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)'];
const SHAPES = [
  '<svg viewBox="0 0 100 100"><polygon points="50,10 93,88 7,88"/></svg>',
  '<svg viewBox="0 0 100 100"><polygon points="50,5 95,50 50,95 5,50"/></svg>',
  '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43"/></svg>',

];

function fitBox(box, maxPx, minPx) {
  if (!box) return minPx;
  const inner = box.querySelector('.fit') || box;
  inner.classList.remove('brk');
  const cs = getComputedStyle(box);
  const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.round(maxPx);
  const over = () => inner.scrollHeight > availH + 1 || inner.scrollWidth > inner.clientWidth + 1;
  box.style.fontSize = s + 'px';
  while (s > minPx && over()) { s -= 2; box.style.fontSize = s + 'px'; }
  if (over()) inner.classList.add('brk');   // 最小でも入らない長い単語は途中で折り返す
  return s;
}

function normQuestion(q) {

  while (choices.length < 4) choices.push('');
  let correct = Number(q.correct); if (!(correct >= 0 && correct <= 3)) correct = 0;
  if (type === 'tf' && correct > 1) correct = 0;
  const answers = Array.isArray(q.answers) ? q.answers.map(a => String(a).trim()).filter(Boolean) : [];
  let time = Number(q.time); if (!(time >= 3)) time = 20;
  return { type, q: String(q.q ?? ''), choices, correct, answers, time };
}

/* ---------- CSV（タブ区切りも可） ---------- */
function parseDelimited(text) {
  const delim = /\t/.test(text.split(/\r?\n/).find(l => l.trim()) || '') ? '\t' : ',';
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') inQ = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const z2h = s => String(s || '').trim().replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
function parseChoiceAnswer(v, choices) {
  const s = z2h(v);
  if (/^[1-4]$/.test(s)) return Number(s) - 1;
  if (/^[A-Da-d]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  return choices.findIndex(c => c.trim() && c.trim() === s);
}
function parseTf(v) {
  const s = z2h(v);
  if (/^([○◯〇Oo]|正|正しい|true|t)$/i.test(s)) return 0;
  if (/^([×xX✕✖]|誤|まちがい|false|f)$/i.test(s)) return 1;
  return -1;
}
function importCsv(text) {
  const rows = parseDelimited(text);
  const out = [], errors = [];
  rows.forEach((r, n) => {
    const cells = r.map(c => c.trim());
    if (n === 0 && /^(問題|問題文|question|q)$/i.test(cells[0])) return; // 見出し行
    const choices = [cells[1] || '', cells[2] || '', cells[3] || '', cells[4] || ''];
    let time = parseInt(z2h(cells[6]).replace(/[^\d]/g, ''), 10);
    if (!time || time < 3) time = 20;
    if (time > 300) time = 300;
    // 形式：8列目で指定。なければ自動判定（選択肢が空なら ○×／記述）
    const tcol = cells[7] || '';
    let type = /記述|text/i.test(tcol) ? 'text' : /○|×|まるばつ|tf/i.test(tcol) ? 'tf' : /選択|choice/i.test(tcol) ? 'choice' : '';
    if (!type) type = choices.some(c => c) ? 'choice' : (parseTf(cells[5]) >= 0 ? 'tf' : 'text');
    let q, prob = '';
    if (type === 'choice') {
      const c = parseChoiceAnswer(cells[5], choices);
      q = normQuestion({ type, q: cells[0], choices, correct: c < 0 ? 0 : c, time });
      prob = c < 0 ? '正解の指定（1〜4）が読み取れません' : questionProblem(q);
    } else if (type === 'tf') {
      const c = parseTf(cells[5]);
      q = normQuestion({ type, q: cells[0], correct: c < 0 ? 0 : c, time });
      prob = c < 0 ? '○×の正解（○ か ×）が読み取れません' : questionProblem(q);
    } else {
      q = normQuestion({ type, q: cells[0], answers: splitAnswers(cells[5]), time });
      prob = questionProblem(q);
    }
    if (prob) errors.push(`${n + 1}行目: ${prob}`);
    else out.push(q);
  });
  return { out, errors };
}
function csvCell(v) { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadText(filename, text) {

let actx = null;
function beep(freq, dur = .12, type = 'sine', vol = .18, delay = 0) {
  if (!H || !H.opts.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) { }
}

      toast(`${out.length}問を取り込みました${errors.length ? `（${errors.length}行はスキップ）` : ''}`);
      if (errors.length) $('#impErr').textContent = 'スキップした行: ' + errors.join(' / ');
    };
    $('#impAdd').onclick = () => doImport(false);
    $('#impRep').onclick = () => doImport(true);
    $('#exp').onclick = () => {
      const lines = ['問題,選択肢1,選択肢2,選択肢3,選択肢4,正解,制限時間,形式'];
      s.questions.forEach(q => {
        const row = q.type === 'choice' ? [q.q, ...q.choices, q.correct + 1, q.time, '選択']
          : q.type === 'tf' ? [q.q, '', '', '', '', TF[q.correct].glyph, q.time, '○×']
            : [q.q, '', '', '', '', q.answers.join(' / '), q.time, '記述'];
        lines.push(row.map(csvCell).join(','));
      });
      downloadText(`${stamp()}${safeFile(s.title)}.csv`, lines.join('\r\n'));
    };
  }
  function onField(e) {
    const f = e.target.dataset.f; if (!f) return;
    const card = e.target.closest('.qcard'), i = Number(card.dataset.i), q = s.questions[i];
    if (f === 'type') {
      if (e.type !== 'change') return;
      q.type = e.target.value;
      if (q.type === 'tf' && q.correct > 1) q.correct = 0;
      saveSets(); render(); return;
    }
    if (f === 'q') q.q = e.target.value;
    else if (f === 'time') q.time = Number(e.target.value);
    else if (f === 'answers') q.answers = splitAnswers(e.target.value);
    else if (f === 'correct') {
      q.correct = Number(e.target.value);
      $$('.ch-edit', card).forEach((el, j) => el.classList.toggle('is-correct', j === q.correct));
    } else if (/^c[0-3]$/.test(f)) q.choices[Number(f[1])] = e.target.value;
    card.querySelector('.qwarn').textContent = questionProblem(q);
    autosave();
  }
  render();
}
 
/* ==========================================================
   先生：ゲーム進行（親機）
   ========================================================== */
let H = null; // 先生側の状態
 
function startHosting(setId) {
  const s = sets.find(x => x.id === setId);
  if (!s) return;
  if (!s.questions.length) { toast('問題がありません'); return; }
  const bad = s.questions.findIndex(q => questionProblem(q));
  if (bad >= 0) { toast(`第${bad + 1}問: ${questionProblem(s.questions[bad])}`, 3500); showEditor(setId); return; }
  H = {
    set: clone(s), opts: { shuffleQ: false, showOnDevice: false, sound: true },
    players: new Map(), kicked: new Set(), phase: 'lobby', order: [], idx: -1,
    answers: new Map(), qStart: 0, timer: null, tickTimer: null, survey: false,
    pin: '', peer: null, status: 'connecting', errType: ''
  };
  openHostPeer(0);
  renderHost();
}
 
function genPin() { return String(Math.floor(100000 + Math.random() * 900000)); }
 
function openHostPeer(tries) {
  if (typeof Peer === 'undefined') { H.status = 'nolib'; updateStatus(); return; }
  const pin = genPin();
  H.pin = pin; H.status = 'connecting';
  const peer = new Peer(PEER_PREFIX + pin);
  H.peer = peer;
  peer.on('open', () => { if (H && H.peer === peer) { H.status = 'ready'; if (H.phase === 'lobby') renderHost(); else updateStatus(); } });
  peer.on('connection', conn => { if (H && H.peer === peer) setupHostConn(conn); });
  peer.on('disconnected', () => {
    // 仲介サーバーとの接続だけが切れた状態。生徒との接続は生きているので再接続を試みる
    if (!H || H.peer !== peer || peer.destroyed) return;
    H.status = 'reconnecting'; updateStatus();
    setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) { } }, 1500);
  });
  peer.on('error', err => {
    if (!H || H.peer !== peer) return;
    if (err.type === 'unavailable-id' && tries < 5) { peer.destroy(); openHostPeer(tries + 1); return; }
    if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'unavailable-id', 'ssl-unavailable'].includes(err.type)) {
      H.status = 'error'; H.errType = err.type; updateStatus();
    } else console.warn('peer error', err);
  });
}
 
function statusHtml() {
  const map = {
    connecting: ['接続準備中…', ''],
    ready: ['● 参加受付中', ''],
    reconnecting: ['再接続中…', ''],
    nolib: ['通信ライブラリを読み込めませんでした（インターネット接続を確認）', 'err'],
    error: [`接続エラー（${esc(H.errType)}）`, 'err']
  };
  const [t, c] = map[H.status] || ['', ''];
  return `<span class="status ${c}">${t}</span>${H.status === 'error' || H.status === 'nolib' ? ' <button class="btn small" id="retryPeer">やり直す</button>' : ''}`;
}
function updateStatus() {
  const el = $('#peerStatus'); if (!el) return;
  el.innerHTML = statusHtml();
  const r = $('#retryPeer');
  if (r) r.onclick = () => {
    if (H.phase !== 'lobby' && !confirm('接続をやり直すとPINが変わり、生徒は入り直しが必要です。よろしいですか？')) return;
    try { H.peer && H.peer.destroy(); } catch (e) { }
    openHostPeer(0); renderHost();
  };
}
 
function send(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) { } }
function onlinePlayers() { return [...H.players.values()].filter(p => p.online); }
 
function setupHostConn(conn) {
  conn.on('data', d => onHostData(conn, d));
  const gone = () => {
    if (!H) return;
    for (const p of H.players.values()) if (p.conn === conn) { p.online = false; p.conn = null; }
    refreshPlayersUi();
    if (H.phase === 'question') checkAllAnswered();
  };
  conn.on('close', gone);
  conn.on('error', gone);
}
 
function cleanName(n) { return String(n ?? '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 12); }
function uniqueName(name) {
  const used = new Set([...H.players.values()].map(p => p.name));
  if (!used.has(name)) return name;
  for (let k = 2; ; k++) if (!used.has(`${name}(${k})`)) return `${name}(${k})`;
}
 
function onHostData(conn, d) {
  if (!H || !d || typeof d !== 'object') return;
  if (d.t === 'join') {
    const cid = String(d.cid || '').slice(0, 40);
    const name = cleanName(d.name);
    const icon = ICONS.includes(d.icon) ? d.icon : ICONS[0];
    if (!cid || !name) { send(conn, { t: 'err', msg: '名前を入力してください' }); return; }
    if (H.kicked.has(cid)) { send(conn, { t: 'kick' }); setTimeout(() => conn.close(), 400); return; }
    let p = H.players.get(cid);
    if (p) {
      const old = p.conn;
      p.conn = conn; p.online = true;            // 先に差し替えてから古い接続を閉じる
      if (old && old !== conn) { try { old.close(); } catch (e) { } }
    } else {
      if (H.phase === 'final') { send(conn, { t: 'err', msg: 'このゲームはもう終わっています' }); return; }
      p = { cid, name: uniqueName(name), icon, score: 0, correctCount: 0, qres: [], conn, online: true, lastPts: 0, lastCorrect: false, lastAnswered: false, rank: 1 };
      H.players.set(cid, p);
      if (H.phase === 'lobby') sfx.join();
    }
    conn.cid = cid;
    send(conn, { t: 'welcome', name: p.name, icon: p.icon, title: H.set.title });
    syncPlayer(p);
    refreshPlayersUi();
  } else if (d.t === 'a') {
    const p = H.players.get(conn.cid);
    if (p && p.conn === conn) handleAnswer(p, d);
  }
}
 
/* 途中参加・再接続した生徒に、今の状態を送る */
function syncPlayer(p) {
  const c = p.conn;
  switch (H.phase) {
    case 'lobby': send(c, { t: 'lobby' }); break;
    case 'ready': send(c, { t: 'ready', i: H.idx, n: H.order.length, type: curQ().type }); break;
    case 'question':
      if (H.answers.has(p.cid)) send(c, { t: 'answered' });
      else send(c, qPayload(Math.max(0, curQ().time * 1000 - (performance.now() - H.qStart))));
      break;
    case 'reveal': case 'board': send(c, resultPayload(p)); break;
    case 'final': send(c, endPayload(p)); break;
  }
}
 
function curQ() { return H.set.questions[H.order[H.idx]]; }
function availIdx(q) {
  if (q.type === 'tf') return [0, 1];
  if (q.type === 'text') return [];
  return [0, 1, 2, 3].filter(j => q.choices[j] && q.choices[j].trim());
}
function qPayload(remainMs) {
  const q = curQ();
  return {
    t: 'q', i: H.idx, n: H.order.length, type: q.type, avail: availIdx(q), time: q.time, remain: Math.round(remainMs),
    survey: isSurvey(q),
    text: H.opts.showOnDevice ? q.q : null, choices: H.opts.showOnDevice && q.type === 'choice' ? q.choices : null
  };
}
function ranking() {
  const arr = [...H.players.values()].sort((a, b) => b.score - a.score);
  let rank = 0, prev = null;
  arr.forEach((p, i) => { if (p.score !== prev) { rank = i + 1; prev = p.score; } p.rank = rank; });
  return arr;
}
function resultPayload(p) {
  const q = curQ(), r = p.qres[H.idx] || {};
  return {
    t: 'r', i: H.idx, type: q.type, survey: H.survey, correct: p.lastCorrect, answered: p.lastAnswered, pts: p.lastPts,
    score: p.score, rank: p.rank, total: H.players.size, ans: H.survey ? '' : correctLabel(q), mine: r.a && r.a.s ? r.a.s : ''
  };
}
function gradedCount() { return H.order.filter(k => !isSurvey(H.set.questions[k])).length; }
function endPayload(p) { return { t: 'end', rank: p.rank, score: p.score, total: H.players.size, correctCount: p.correctCount, n: gradedCount() }; }
function broadcast(msgFn) { for (const p of H.players.values()) if (p.online) send(p.conn, typeof msgFn === 'function' ? msgFn(p) : msgFn); }
 
function clearTimers() { clearTimeout(H.timer); clearInterval(H.tickTimer); H.timer = null; H.tickTimer = null; }
function resetScores() { for (const p of H.players.values()) Object.assign(p, { score: 0, correctCount: 0, qres: [], lastPts: 0, lastCorrect: false, lastAnswered: false, rank: 1 }); }
 
function startGame() {
  if (!H.players.size) return;
  H.order = H.set.questions.map((_, i) => i);
  if (H.opts.shuffleQ) for (let i = H.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [H.order[i], H.order[j]] = [H.order[j], H.order[i]]; }
  resetScores();
  H.idx = -1;
  nextQuestion();
}
 
function nextQuestion() {
  clearTimers();
  H.idx++;
  if (H.idx >= H.order.length) { showFinal(); return; }
  H.phase = 'ready';
  H.answers = new Map();
  H.survey = isSurvey(curQ());
  broadcast({ t: 'ready', i: H.idx, n: H.order.length, type: curQ().type });
  renderHost();
  H.timer = setTimeout(beginAnswering, READY_MS);
}
 
function beginAnswering() {
  const q = curQ();
  H.phase = 'question';
  H.qStart = performance.now();
  broadcast(() => qPayload(q.time * 1000));
  renderHost();
  let lastSec = q.time;
  H.tickTimer = setInterval(() => {
    const remain = q.time * 1000 - (performance.now() - H.qStart);
    const sec = Math.max(0, Math.ceil(remain / 1000));
    const t = $('#timer');
    if (t) { t.textContent = sec; t.classList.toggle('hurry', sec <= 5); }
    if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) sfx.tick(); }
    if (remain <= 0) endQuestion();
  }, 100);
}
 
function handleAnswer(p, d) {
  if (H.phase !== 'question' || d.i !== H.idx || H.answers.has(p.cid)) return;
  const q = curQ();
  let a;
  if (q.type === 'text') {
    const s = String(d.s ?? '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, TEXT_MAX);
    if (!s) return;
    a = { s };
  } else {
    const c = Number(d.c);
    if (!availIdx(q).includes(c)) return;
    a = { c };
  }
  a.ms = performance.now() - H.qStart;
  H.answers.set(p.cid, a);
  send(p.conn, { t: 'answered' });
  const el = $('#answeredN'); if (el) el.textContent = H.answers.size;
  checkAllAnswered();
}
function checkAllAnswered() {
  const on = onlinePlayers();
  if (on.length && on.every(p => H.answers.has(p.cid))) setTimeout(endQuestion, 400);
}
 
function judge(q, a) {
  if (!a) return false;
  if (q.type === 'text') { const n = normAnswer(a.s); return q.answers.some(x => normAnswer(x) === n); }
  return a.c === q.correct;
}
/* 今の問題を採点（記述式で正解を追加・取り消ししたときも呼び直す） */
function scoreCurrent() {
  const q = curQ(), limit = q.time * 1000;
  for (const p of H.players.values()) {
    const a = H.answers.get(p.cid);
    const ok = !H.survey && judge(q, a);
    // 正解なら 500〜1000点。速いほど高得点
    const pts = ok ? Math.round(1000 * (1 - Math.min(a.ms / limit, 1) / 2)) : 0;
    p.qres[H.idx] = { a: a || null, ok, pts };
    p.score = p.qres.reduce((t, r) => t + (r ? r.pts : 0), 0);
    p.correctCount = p.qres.filter(r => r && r.ok).length;
    p.lastPts = pts; p.lastCorrect = ok; p.lastAnswered = !!a;
  }
  ranking();
}
 
function endQuestion() {
  if (!H || H.phase !== 'question') return;
  clearTimers();
  scoreCurrent();
  H.phase = 'reveal';
  broadcast(p => resultPayload(p));
  sfx.end();
  renderHost();
}
 
/* 記述式：答えのグループをタップして正解/不正解を切り替える */
function toggleTextGroup(norm, raw) {
  const q = curQ();
  if (q.answers.some(x => normAnswer(x) === norm)) q.answers = q.answers.filter(x => normAnswer(x) !== norm);
  else q.answers.push(raw);
  scoreCurrent();
  broadcast(p => resultPayload(p));
  renderHost();
}
 
function showBoard() { H.phase = 'board'; renderHost(); }
function showFinal() {
  clearTimers();
  ranking();
  H.phase = 'final';
  broadcast(p => endPayload(p));
  sfx.fanfare();
  renderHost();
}
function backToLobby() {
  clearTimers();
  H.phase = 'lobby'; H.idx = -1;
  resetScores();
  broadcast({ t: 'lobby' });
  renderHost();
}
function closeHosting() {
  if (!H) return;
  clearTimers();
  broadcast({ t: 'closed' });
  const peer = H.peer;
  setTimeout(() => { try { peer && peer.destroy(); } catch (e) { } }, 300);
  H = null;
  showHostHome();
}
function downloadResults() {
  const arr = ranking();
  const qs = H.order.map(k => H.set.questions[k]);
  const head = ['順位', 'アイコン', '名前', '得点', '正解数', ...qs.map((q, i) => `Q${i + 1}(${TYPE_LABEL[q.type]}) ${q.q.replace(/\s+/g, ' ').slice(0, 20)}`)];
  const lines = [head.map(csvCell).join(',')];
  arr.forEach(p => lines.push([p.rank, p.icon, p.name, p.score, p.correctCount, ...qs.map((q, i) => {
    const r = p.qres[i];
    if (!r || !r.a) return '-';
    const mark = isSurvey(q) ? '' : (r.ok ? '○' : '×');
    if (q.type === 'text') return `${mark}${mark ? ' ' : ''}${r.a.s}`;
    if (q.type === 'tf') return `${mark}（${TF[r.a.c].glyph}）`;
    return `${mark}（${r.a.c + 1}）`;
  })].map(csvCell).join(',')));
  downloadText(`${stamp()}${safeFile(H.set.title)}_結果.csv`, lines.join('\r\n'));
}
 
/* ---------- 先生画面の描画 ---------- */
function joinUrl() { return location.href.split('#')[0].split('?')[0] + '?pin=' + H.pin; }
function qrHtml(url) {
  if (typeof qrcode !== 'function') return '';
  try { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); return qr.createImgTag(5, 8, '参加用QRコード'); } catch (e) { return ''; }
}
function vmin(wRatio, hRatio) { return Math.min(innerWidth * wRatio, innerHeight * hRatio); }
 
/* 選択肢パネル（選択式・○×） */
function ansGridHtml(q, mode) {
  if (q.type === 'tf') {
    return `<div class="ans-grid two">${TF.map((t, j) => `
      <div class="ans tfbox ${mode === 'reveal' && j !== q.correct ? 'dim' : ''}" style="--c:${t.color}">
        <span class="tfglyph">${t.glyph}</span>${mode === 'reveal' && j === q.correct ? '<span class="mark">✔</span>' : ''}</div>`).join('')}</div>`;
  }
  return `<div class="ans-grid">${[0, 1, 2, 3].map(j => {
    const blank = !q.choices[j] || !q.choices[j].trim();

    return `<div class="ans ${blank ? 'blank' : ''} ${dim ? 'dim' : ''}" style="--c:${COLORS[j]}">${shape(j)}<span class="txt fit">${esc(q.choices[j])}</span>${mode === 'reveal' && j === q.correct ? '<span class="mark">✔</span>' : ''}</div>`;
  }).join('')}</div>`;
}
 
/* 文字サイズを画面に合わせる */
function fitHost() {
  if (!H || H.phase === 'lobby') return;
  $$('.q-text').forEach(el => fitBox(el, vmin(.065, .095), 18));
  const boxes = $$('.ans:not(.blank):not(.tfbox)');
  if (boxes.length) {

  }
}
window.addEventListener('resize', () => { clearTimeout(fitHost._t); fitHost._t = setTimeout(fitHost, 120); });
 
function renderHost() {
  if (!H) return;
  setStage(true);
  const ph = H.phase;
  if (ph === 'lobby') return renderLobby();
  const q = curQ();
  const head = label => `
    <div class="game-head">
      <span>${label}</span>
      <span class="grow"></span>

      </div></div>`;
  } else if (ph === 'question') {
    app.innerHTML = `<div class="game">${head(pos)}

        <div class="timer" id="timer">${q.time}</div>
        <button class="btn small ghost skip-btn" id="skip">締め切る ⏭</button>

      </div>
      ${q.type === 'text'
        ? `<div class="text-panel"><span class="big">✏️</span>手元の端末に答えを入力しよう</div>`

    if (q.type === 'text') {

      }

        .sort((a, b) => (b.ok - a.ok) || (b.count - a.count));

          <div class="col ${v.j !== q.correct ? 'dim' : ''}" style="--c:${v.color}">
            <div class="bar" style="height:${Math.round(counts[v.j] / max * 13)}vh"></div>
            <div class="lab">${v.icon} ${counts[v.j]}${v.j === q.correct ? ' ✔' : ''}</div>
          </div>`).join('')}</div>
        <div class="next-row">${nextBtn}</div>
        ${ansGridHtml(q, 'reveal')}</div>`;
    }
    $('#next').onclick = last ? showFinal : showBoard;
  } else if (ph === 'board') {
    const top = ranking().slice(0, 5);
    app.innerHTML = `<div class="game">${head(pos)}
      <div class="board">
        <h2>ランキング</h2>
        <div class="rank-list">${top.map((p, i) => `
          <div class="rank-item" style="animation-delay:${i * .08}s"><span class="r">${p.rank}</span><span class="ic">${p.icon}</span><span class="nm">${esc(p.name)}</span>
          ${p.lastPts ? `<span class="plus">+${p.lastPts}</span>` : ''}<span>${p.score}</span></div>`).join('') || '<p>参加者がいません</p>'}</div>
      </div>
      <div class="next-row"><button class="btn go" id="next">次の問題 ▶</button></div></div>`;
    $('#next').onclick = nextQuestion;
  } else if (ph === 'final') {
    const arr = ranking();
    const pod = (p, cls, label) => p ? `<div class="pod ${cls}"><div class="ic">${p.icon}</div><div class="nm">${esc(p.name)}</div><div class="sc">${p.score}点</div><div class="block">${label}</div></div>` : `<div class="pod ${cls}"></div>`;
    const n = gradedCount();
    app.innerHTML = `<div class="game">${head('結果発表')}
      <div class="board">
        <h2>${esc(H.set.title)}</h2>
        <div class="podium">${pod(arr[1], 'p2', arr[1] ? arr[1].rank : '2')}${pod(arr[0], 'p1', '1')}${pod(arr[2], 'p3', arr[2] ? arr[2].rank : '3')}</div>
        <table class="final-table"><tr><th>順位</th><th>名前</th><th>得点</th><th>正解数</th></tr>
          ${arr.map(p => `<tr><td>${p.rank}</td><td>${p.icon} ${esc(p.name)}</td><td>${p.score}</td><td>${p.correctCount} / ${n}</td></tr>`).join('')}</table>
        <div class="row-btns" style="margin-bottom:20px">
          <button class="btn" id="csvOut">結果をCSVで保存</button>
          <button class="btn primary" id="again">同じメンバーでもう一度</button>
          <button class="btn danger" id="quit">終了する</button>
        </div>
      </div></div>`;
    $('#csvOut').onclick = downloadResults;
    $('#again').onclick = backToLobby;
    $('#quit').onclick = () => { if (confirm('ゲームを終了しますか？（生徒の接続も切れます）')) closeHosting(); };
  }
  $('#fs').onclick = toggleFs;
  $('#abort').onclick = () => {
    if (H.phase === 'final') { if (confirm('ゲームを終了しますか？')) closeHosting(); return; }
    if (confirm('ゲームを中止して待機画面に戻りますか？（得点はリセットされます）')) backToLobby();
  };
  updateStatus();
  fitHost();
}
 
function toggleFs() {
  try {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } catch (e) { toast('この端末では全画面にできません（iPadは「ホーム画面に追加」から開くと全画面になります）', 3500); }
}
 
function renderLobby() {
  const ready = H.status === 'ready';
  const url = ready ? joinUrl() : '';
  const isFile = location.protocol === 'file:';
  app.innerHTML = `
  <div class="lobby">
    <div class="lobby-head">
      <button class="btn small ghost" id="lobbyBack">← 戻る</button>
      <span class="ttl">${esc(H.set.title)}（${H.set.questions.length}問）</span>
      <span id="peerStatus"></span>
      <button class="btn small ghost" id="fs">⛶ 全画面</button>
    </div>
    <div class="join-panel">
      <div>
        <div class="lbl">参加用PIN</div>
        <div class="pin">${ready ? H.pin.replace(/(\d{3})(\d{3})/, '$1 $2') : '------'}</div>
        ${ready && !isFile ? `<div class="join-url">${esc(url)}</div>` : ''}
      </div>
      ${ready && !isFile ? `<div class="qr">${qrHtml(url)}</div>` : ''}
    </div>
    ${isFile ? `<div class="warn-box">このファイルをPCで直接開いているため、生徒用のURLとQRコードは表示していません。GitHub Pagesなどで公開したページから開くと、URLとQRコードが出ます。（PINでの参加は、生徒が同じページを開けば可能です）</div>` : ''}
    <div class="lobby-body">
      <div class="lobby-bar">
        <span class="count"><span id="pcount">0</span>人</span>
        <div class="opts">
          <label><input type="checkbox" id="optShuffle" ${H.opts.shuffleQ ? 'checked' : ''}>問題の順番をシャッフル</label>
          <label><input type="checkbox" id="optShow" ${H.opts.showOnDevice ? 'checked' : ''}>生徒の端末にも問題と選択肢を表示</label>
          <label><input type="checkbox" id="optSound" ${H.opts.sound ? 'checked' : ''}>効果音</label>
        </div>
        <button class="btn go" id="start" style="font-size:22px">スタート ▶</button>
      </div>
      <div class="players" id="players"></div>
      <div class="waiting-msg" id="waitMsg">生徒の参加を待っています…<br><small>名前をタップすると退出させられます</small></div>
    </div>
  </div>`;
  $('#lobbyBack').onclick = () => {
    if (H.players.size && !confirm('待機画面を閉じますか？（参加中の生徒の接続は切れます）')) return;
    closeHosting();
  };
  $('#fs').onclick = toggleFs;
  $('#optShuffle').onchange = e => H.opts.shuffleQ = e.target.checked;
  $('#optShow').onchange = e => H.opts.showOnDevice = e.target.checked;
  $('#optSound').onchange = e => { H.opts.sound = e.target.checked; if (H.opts.sound) sfx.join(); };
  $('#start').onclick = startGame;
  $('#players').onclick = e => {
    const b = e.target.closest('[data-cid]'); if (!b) return;
    const p = H.players.get(b.dataset.cid); if (!p) return;
    if (!confirm(`「${p.name}」さんを退出させますか？`)) return;
    H.kicked.add(p.cid);
    send(p.conn, { t: 'kick' });
    const c = p.conn; setTimeout(() => { try { c && c.close(); } catch (e) { } }, 400);
    H.players.delete(p.cid);
    refreshPlayersUi();
  };
  updateStatus();
  refreshPlayersUi();
}
 
function refreshPlayersUi() {
  if (!H || H.phase !== 'lobby') return;
  const box = $('#players'); if (!box) return;
  const arr = [...H.players.values()];
  box.innerHTML = arr.map(p => `<button class="pchip ${p.online ? '' : 'off'}" data-cid="${esc(p.cid)}" title="タップで退出"><span class="ic">${p.icon}</span>${esc(p.name)}</button>`).join('');
  $('#pcount').textContent = arr.filter(p => p.online).length;
  $('#start').disabled = !arr.some(p => p.online);
  $('#waitMsg').classList.toggle('hidden', arr.length > 0);
}
 
window.addEventListener('beforeunload', e => {
  if (H && H.players.size) { e.preventDefault(); e.returnValue = ''; }
});
 
/* ==========================================================
   生徒：参加・回答（子機）
   ========================================================== */
let P = null; // 生徒側の状態
 
function getCid() {
  let c = null;
  try { c = sessionStorage.getItem(SS_CID); } catch (e) { }
  if (!c) { c = uid(); try { sessionStorage.setItem(SS_CID, c); } catch (e) { } }
  return c;
}
 
function showJoin(pin, errMsg = '') {
  setStage(true);
  const savedName = store.get(LS_NAME, '');
  let icon = store.get(LS_ICON, '');
  if (!ICONS.includes(icon)) icon = ICONS[Math.floor(Math.random() * ICONS.length)];
  app.innerHTML = `
  <div class="center-screen">
    <h1 class="logo" style="font-size:36px;margin-bottom:16px">はやおしクイズ</h1>
    <form class="join-form" id="jf" autocomplete="off">
      <input id="pin" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="PIN（6けた）" value="${esc(pin)}">
      <div class="icon-row"><span class="icon-preview" id="iconPrev">${icon}</span><input id="nm" maxlength="12" placeholder="なまえ" value="${esc(savedName)}"></div>
      <div class="lbl">アイコンをえらぼう</div>
      <div class="icon-grid" id="iconGrid">${ICONS.map(ic => `<button type="button" class="${ic === icon ? 'on' : ''}" data-ic="${ic}">${ic}</button>`).join('')}</div>
      <button class="btn go" type="submit">参加する</button>
      <div class="join-err" id="jerr">${esc(errMsg)}</div>
    </form>
    ${H ? '' : '<button class="btn small ghost" id="back" style="margin-top:20px">← 戻る</button>'}
  </div>`;
  const back = $('#back'); if (back) back.onclick = () => { history.replaceState(null, '', location.pathname); showLanding(); };
  $('#iconGrid').onclick = e => {
    const b = e.target.closest('[data-ic]'); if (!b) return;
    icon = b.dataset.ic;
    $$('#iconGrid button').forEach(x => x.classList.toggle('on', x === b));
    $('#iconPrev').textContent = icon;
  };
  if (!pin) $('#pin').focus();
  $('#jf').onsubmit = e => {
    e.preventDefault();
    const p = $('#pin').value.replace(/\D/g, '');
    const n = cleanName($('#nm').value);
    if (p.length !== 6) { $('#jerr').textContent = 'PINは6けたの数字です'; return; }
    if (!n) { $('#jerr').textContent = '名前を入力してください'; return; }
    store.set(LS_NAME, n); store.set(LS_ICON, icon);
    joinGame(p, n, icon);
  };
}
 
function plScreen(inner, opts = {}) {
  app.className = 'stage';
  app.innerHTML = `<div class="pl ${opts.cls || ''}">
    ${inner}
    <div class="pl-foot"><span class="who"><span class="ic">${P ? P.icon : ''}</span>${esc(P ? P.name : '')}</span><span class="sc">${P ? P.score : 0}</span></div>
  </div>`;
}
function plMsg(big, mid = '', spinner = false, cls = '') {
  plScreen(`<div class="pl-main">${spinner ? '<div class="spinner"></div>' : ''}<div class="big-msg">${big}</div>${mid ? `<div class="mid-msg">${mid}</div>` : ''}</div>`, { cls });
}
 
function leavePeer() {
  if (!P) return;
  clearTimeout(P.connTimer); clearInterval(P.barTimer);
  const peer = P.peer; P.peer = null; P.conn = null;
  try { peer && peer.destroy(); } catch (e) { }
}
 
function joinGame(pin, name, icon) {
  if (P) leavePeer();
  P = { pin, name, icon, cid: getCid(), peer: null, conn: null, score: P && P.pin === pin ? P.score : 0, ended: false, curI: -1 };
  setStage(true);
  plMsg('接続中…', '', true);
  if (typeof Peer === 'undefined') { showJoin(pin, '通信ライブラリを読み込めませんでした。インターネット接続を確認してください。'); return; }
  const me = P;
  const fail = msg => { if (P !== me) return; leavePeer(); showJoin(pin, msg); };
  me.connTimer = setTimeout(() => fail('接続できませんでした。PINを確認するか、少し待ってからもう一度試してください。（学校のネットワークで通信が制限されている可能性もあります）'), 15000);
  const peer = new Peer();
  me.peer = peer;
  peer.on('open', () => {
    if (P !== me) return;
    const conn = peer.connect(PEER_PREFIX + pin, { reliable: true });
    me.conn = conn;
    conn.on('open', () => { clearTimeout(me.connTimer); send(conn, { t: 'join', cid: me.cid, name: me.name, icon: me.icon }); });
    conn.on('data', d => { if (P === me) onPlayerData(d); });
    const lost = () => {
      if (P !== me || me.ended || !me.conn) return;
      me.conn = null;
      plScreen(`<div class="pl-main"><div class="big-msg">接続が切れました</div><div class="mid-msg">もう一度つなぎ直してください</div><button class="btn go" id="rejoin" style="font-size:22px">再接続する</button></div>`);
      $('#rejoin').onclick = () => joinGame(me.pin, me.name, me.icon);
    };
    conn.on('close', lost);
    conn.on('error', lost);
  });
  peer.on('error', err => {
    if (P !== me) return;
    if (err.type === 'peer-unavailable') fail('そのPINのゲームが見つかりません。番号を確認してください。');
    else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable'].includes(err.type)) {
      if (!me.conn || !me.conn.open) fail('接続できませんでした（' + err.type + '）。インターネット接続を確認してください。');
    }
  });
}
 
function onPlayerData(d) {
  if (!d || typeof d !== 'object') return;
  clearInterval(P.barTimer);
  switch (d.t) {
    case 'welcome':
      P.name = d.name; P.icon = d.icon || P.icon; P.title = d.title;
      break;
    case 'lobby':
      P.score = 0;
      plMsg(`<div class="me-icon">${P.icon}</div>参加しました！`, `先生の画面に<br><b>${esc(P.name)}</b><br>が出ているか確認してね<br><small>まもなく始まります</small>`);
      break;
    case 'ready':
      plMsg(`第${d.i + 1}問`, `${TYPE_LABEL[d.type] || ''}<br>先生の画面を見てね！`, true);
      break;
    case 'q': renderAnswerPad(d); break;
    case 'answered': plMsg('回答しました！', 'みんなの回答を待っています…', true); break;
    case 'r': {
      P.score = d.score;
      const mine = d.mine ? `<div class="your-ans">あなたの答え：${esc(d.mine)}</div>` : '';
      const ans = d.ans ? `<div class="mid-msg">正解：${esc(d.ans)}</div>` : '';
      const rank = `<div class="mid-msg">いま ${d.rank}位 / ${d.total}人</div>`;
      if (d.survey) plScreen(`<div class="pl-main"><div class="res-icon">📝</div><div class="big-msg">${d.answered ? '送信ありがとう！' : '時間切れ…'}</div>${mine}<div class="mid-msg">先生の画面でみんなの答えを見よう</div></div>`);
      else if (!d.answered) plScreen(`<div class="pl-main"><div class="res-icon">⏰</div><div class="big-msg">時間切れ…</div>${ans}${rank}</div>`, { cls: 'ng' });
      else if (d.correct) plScreen(`<div class="pl-main"><div class="res-icon">⭕</div><div class="big-msg">正解！</div><div class="pts">+${d.pts}</div>${mine}${rank}</div>`, { cls: 'ok' });
      else plScreen(`<div class="pl-main"><div class="res-icon">❌</div><div class="big-msg">ざんねん…</div>${mine}${ans}${rank}</div>`, { cls: 'ng' });
      break;
    }
    case 'end':
      P.score = d.score;
      plScreen(`<div class="pl-main"><div class="mid-msg">結果発表</div><div class="me-icon">${P.icon}</div><div class="big-msg" style="font-size:64px">${d.rank}位</div><div class="mid-msg">${d.total}人中 ／ ${d.score}点<br>正解 ${d.correctCount} / ${d.n}問</div>${d.rank <= 3 ? '<div class="res-icon">🏆</div>' : ''}</div>`);
      break;
    case 'kick':
      P.ended = true; leavePeer();
      plMsg('退出しました', '先生によって退出になりました');
      break;
    case 'closed':
      P.ended = true; leavePeer();
      plScreen(`<div class="pl-main"><div class="big-msg">ゲームが終了しました</div><div class="mid-msg">参加ありがとう！</div><button class="btn" id="toJoin">別のゲームに参加</button></div>`);
      $('#toJoin').onclick = () => { history.replaceState(null, '', location.pathname); P = null; showJoin(''); };
      break;
    case 'err':
      P.ended = true; { const pin = P.pin; leavePeer(); showJoin(pin, d.msg || 'エラー'); }
      break;
  }
}
 
function renderAnswerPad(d) {
  P.curI = d.i;
  const head = d.text ? `<div class="pl-qtext">${esc(d.text)}</div>` : `<div class="mid-msg" style="text-align:center">第${d.i + 1}問 / ${d.n}</div>`;
  let body;
  if (d.type === 'text') {
    body = `<form class="pl-textform" id="tf" autocomplete="off">
      <div class="lead">${d.survey ? '思ったことを書いてね' : '答えを入力してね'}</div>
      <input id="tans" maxlength="${TEXT_MAX}" placeholder="ここに入力" enterkeyhint="send">
      <button class="btn go" type="submit">送信 ▶</button>
    </form>`;
  } else if (d.type === 'tf') {
    body = `<div class="pl-grid" style="grid-template-rows:1fr">${TF.map((t, j) => `<button class="pl-btn" data-c="${j}" style="--c:${t.color}"><span class="tfglyph">${t.glyph}</span></button>`).join('')}</div>`;
  } else {
    const withText = Array.isArray(d.choices);
    body = `<div class="pl-grid">${[0, 1, 2, 3].map(j => {
      const ok = d.avail.includes(j);
      return `<button class="pl-btn ${ok ? '' : 'blank'} ${withText ? 'with-text' : ''}" data-c="${j}" style="--c:${COLORS[j]}" ${ok ? '' : 'disabled'}>${shape(j)}${withText ? `<span>${esc(d.choices[j])}</span>` : ''}</button>`;
    }).join('')}</div>`;
  }
  plScreen(`<div class="pl-q">${head}<div class="pl-timebar"><i id="bar"></i></div>${body}</div>`);
  const total = d.time * 1000, endAt = performance.now() + d.remain;
  const bar = $('#bar');
  P.barTimer = setInterval(() => {
    const r = Math.max(0, endAt - performance.now());
    bar.style.width = (r / total * 100) + '%';
    if (r <= 0) clearInterval(P.barTimer);
  }, 100);
  const submit = payload => {
    if (!P.conn) return;
    clearInterval(P.barTimer);
    send(P.conn, Object.assign({ t: 'a', i: d.i }, payload));
    plMsg('回答しました！', 'みんなの回答を待っています…', true);
  };
  if (d.type === 'text') {
    const inp = $('#tans');
    let composing = false;
    inp.addEventListener('compositionstart', () => composing = true);
    inp.addEventListener('compositionend', () => composing = false);
    $('#tf').onsubmit = e => {
      e.preventDefault();
      if (composing) return;                 // 日本語変換の確定Enterでは送信しない
      const s = inp.value.trim();
      if (!s) { inp.focus(); return; }
      submit({ s });
    };
    inp.focus();
  } else {
    $$('.pl-btn').forEach(b => b.onclick = () => submit({ c: Number(b.dataset.c) }));
  }
}
 
/* ==========================================================
   起動
   ========================================================== */
(function boot() {
  const pin = new URLSearchParams(location.search).get('pin');
  if (pin) showJoin(pin.replace(/\D/g, '').slice(0, 6));
  else showLanding();
})();
</script>
</body>
